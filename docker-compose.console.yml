version: '3.8'

services:
  console-postgres:
    image: postgres:15-alpine
    container_name: truffles-console-postgres
    environment:
      POSTGRES_USER: truffles
      POSTGRES_PASSWORD: password
      POSTGRES_DB: truffles_console
    ports:
      - "5433:5432"
    volumes:
      - console_postgres_data:/var/lib/postgresql/data
    networks:
      - truffles-console-net

  console-keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: truffles-console-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: auth.truffles.kz
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./ops/keycloak-realm.json:/opt/keycloak/data/import/realm.json
      - ./ops/keycloak-theme/truffles:/opt/keycloak/themes/truffles
    networks:
      - truffles-console-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.console-keycloak.rule=Host(`auth.truffles.kz`)"
      - "traefik.http.routers.console-keycloak.entrypoints=web,websecure"
      - "traefik.http.routers.console-keycloak.tls.certresolver=myresolver"
      - "traefik.http.services.console-keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=proxy-net"

  console-redis:
    image: redis:7-alpine
    container_name: truffles-console-redis
    ports:
      - "6380:6379"
    networks:
      - truffles-console-net

volumes:
  console_postgres_data:


networks:
  truffles-console-net:
    driver: bridge
  proxy-net:
    external: true
