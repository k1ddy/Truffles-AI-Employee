      - маникюр
      - ногти
      - маникюр классический
      - классический маникюр
      - аппаратный маникюр
      - комбинированный маникюр
      - мужской маникюр
      - маникюр с гель-лаком
      - маникюр с покрытием гель-лак
    duration_min: 75
    price_display: от 6000 KZT
    description: Классический, аппаратный, комбинированный маникюр; возможно покрытие гель-лак.
    category: nails

  - id: nail_design
