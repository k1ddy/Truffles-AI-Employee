# Beauty Salon v1 — реальные данные салона "Mira" (Алматы).
# Источник: truffles-api/app/knowledge/demo_salon/SALON_TRUTH.yaml.
# Контракт: SPECS/PACK_V1.md
pack_id: beauty_salon_v1
pack_version: 1
vertical: beauty_salon
locale: ru-KZ

business:
  name: Салон красоты Mira
  summary: >
    Салон красоты Mira в Алматы (ул. Абая 150). Парикмахерские услуги, маникюр и педикюр,
    брови и ресницы, уход за лицом, депиляция. Работаем ежедневно с 9:00 до 21:00,
    последняя запись 20:00–20:30.
  address: Алматы, ул. Абая 150, угол Розыбакиева. Вход со стороны Розыбакиева, 2 этаж.
  hours: ежедневно 9:00–21:00, без выходных
  contacts:
    instagram: https://instagram.com/mira_beauty_kz

rules:
  bot_can_confirm: false
  required_for_booking:
    - service
    - datetime
    - name
    - phone
  identity_for_lookup:
    - name_or_phone
  escalate_topics:
    - medical
    - refund
    - complaint
    - legal
    - cancel
    - reschedule
    - payment
  cancellation_policy: >
    Отмену записи подтверждает администратор. Бот собирает имя, услугу
    и контактный номер и передаёт диалог администратору.
  reschedule_policy: >
    Перенос записи подтверждает администратор. Бот собирает желаемое
    время и передаёт диалог администратору.

capabilities:
  - FACT
  - COLLECT
  - BOOKING
  - MANAGE
  - HANDOFF

services:
  # Ногти
  - id: manicure
    name: Маникюр
    aliases:
