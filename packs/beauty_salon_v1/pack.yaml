specialists:
  - id: aigerim
    name: Айгерим
    service_ids:
      - manicure
      - pedicure
      - nail_extension_gel
      - nail_extension_polygel
    bio: 6 лет опыта; аппаратные техники и укрепление.

  - id: madina
    name: Мадина
    service_ids:
      - haircut
      - coloring
    bio: 5 лет опыта; длинные волосы, сложные окрашивания и блонд.

  - id: dinara
    name: Динара
    service_ids:
      - brows_lashes
    bio: 4 года опыта; брови и ресницы.

  - id: asem
    name: Асем
    service_ids:
      - facial_care
    bio: 5 лет опыта; деликатный уход за лицом, мягкие пилинги.

tools:
  - id: calendar.list_slots
    description: List available booking slots for a service and date.
    args_schema:
      service_query: text
      date: text
      duration_min: number
      specialist_id: text
    requires_capability: BOOKING

  - id: calendar.book_slot
    description: Create a pending appointment.
    args_schema:
      service_query: text
      start_at: datetime
      customer_name: text
      customer_phone: text
      specialist_id: text
    requires_capability: BOOKING

  - id: calendar.get_booking
    description: Look up an existing appointment by customer identity.
    args_schema:
      service_query: text
      customer_name: text
      customer_phone: text
      lookup_datetime: text
    requires_capability: MANAGE

  - id: handoff.create
    description: Escalate the conversation to a human admin.
    args_schema:
      reason: text
      summary: text
    requires_capability: HANDOFF

