# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idempotency_key:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for safe retries of mutating requests.
      schema:
        type: string
        maxLength: 128
    client_id_header:
      name: X-Client-Id
      in: header
      required: false
      description: Client selection when identity maps to multiple clients.
      schema:
        type: string
        format: uuid
    branch_id_header:
      name: X-Branch-Id
      in: header
      required: false
      description: Branch selection when identity is branch-scoped or multiple branches exist.
      schema:
        type: string
        format: uuid
    branch_id_query:
      name: branch_id
      in: query
      required: false
      description: Optional branch override for branch-scoped operations.
      schema:
        type: string
        format: uuid
    case_id:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "39af8e47-a062-4b81-8343-34bdc3084ef9"
    agent_id:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "f0b1a4c7-8f33-4f92-9b1f-9fe0f3d3e7b1"
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Pagination cursor (opaque)
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AUTH_REQUIRED
              message: Authentication required
              trace_id: abc123
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_PARAM
              message: Invalid parameter
              trace_id: abc123
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ACCESS_DENIED
              message: You do not have permission to perform this action
              trace_id: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Case not found
              trace_id: abc123
    CaseAlreadyTaken:
      description: Case already assigned to another agent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CASE_ALREADY_TAKEN
              message: Case is already assigned to another agent
              details:
                assigned_to: John Doe
              trace_id: abc123
    NotAssigned:
      description: Case not assigned to current agent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_ASSIGNED
              message: You must take the case before performing this action
              trace_id: abc123
    IdempotencyConflict:
      description: Idempotency key already used or in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: Request already processed
              trace_id: abc123
    OnboardingStepRequired:
      description: Onboarding step required before this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ONBOARDING_STEP_REQUIRED
              message: Complete previous onboarding step
              details:
                required_step: integrations
              trace_id: abc123
    ConfirmationRequired:
      description: Confirmation required for destructive action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFIRMATION_REQUIRED
              message: Confirmation required
              details:
                action: knowledge_rollback
              trace_id: abc123
    ValidationError:
      description: Request validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    # ── Errors ──
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable message
        details:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        trace_id:
          type: string
          description: Correlation ID for debugging

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    FastAPIErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationErrorItem:
      type: object
      additionalProperties: true

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    # ── Auth ──
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [platform_admin, owner, admin, manager, support]
        client_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Required when role=manager.
        is_active:
          type: boolean

    AgentIdentity:
      type: object
      properties:
        channel:
          type: string
          enum: [telegram]
        external_id:
          type: string
        username:
          type: string
          nullable: true
        linked_at:
          type: string
          format: date-time
          nullable: true

    AgentWithIdentities:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [platform_admin, owner, admin, manager, support]
        client_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        identities:
          type: array
          items:
            $ref: "#/components/schemas/AgentIdentity"

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true

    CompanyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true

    CompanyCreateResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"

    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true
    CompanyListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          nullable: true

    ClientCreateRequest:
      type: object
      required: [slug, company_id]
      properties:
        slug:
          type: string
        company_id:
          type: string
          format: uuid
        status:
          type: string
          nullable: true

    ClientCreateResponse:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"

    ClientUpdateRequest:
      type: object
      properties:
        slug:
          type: string
        company_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          nullable: true
    ClientListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        instance_id:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        knowledge_tag:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        working_hours:
          type: object
          additionalProperties: true
          nullable: true
        booking_settings:
          type: object
          additionalProperties: true
          nullable: true
        onboarding_state:
          type: string
          nullable: true
        onboarding_updated_at:
          type: string
          format: date-time
          nullable: true

    BranchCreateRequest:
      type: object
      required: [client_id, slug, name]
      properties:
        client_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
          nullable: true
        instance_id:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        knowledge_tag:
          type: string
          nullable: true
        working_hours:
          type: object
          additionalProperties: true
          nullable: true
        booking_settings:
          type: object
          additionalProperties: true
          nullable: true
        is_active:
          type: boolean
          nullable: true
        confirmation_id:
          type: string
          format: uuid
          nullable: true

    BranchCreateResponse:
      type: object
      properties:
        branch:
          $ref: "#/components/schemas/Branch"

    BranchUpdateRequest:
      type: object
      properties:
        slug:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        instance_id:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        telegram_chat_id:
          type: string
          nullable: true
        knowledge_tag:
          type: string
          nullable: true
        working_hours:
          type: object
          additionalProperties: true
          nullable: true
        booking_settings:
          type: object
          additionalProperties: true
          nullable: true
        is_active:
          type: boolean
          nullable: true

    BranchListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    OnboardingStepStatus:
      type: object
      required: [id, status, required]
      properties:
        id:
          type: string
          enum: [branch_draft, integrations, team, telegram, knowledge, booking, go_no_go]
        status:
          type: string
          enum: [complete, available, locked, skipped]
        required:
          type: boolean
        missing:
          type: array
          items:
            type: string

    OnboardingStatusResponse:
      type: object
      required: [branch_id, current_step, steps]
      properties:
        branch_id:
          type: string
          format: uuid
        current_step:
          type: string
          enum: [branch_draft, integrations, team, telegram, knowledge, booking, go_no_go]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStepStatus"
        updated_at:
          type: string
          format: date-time
          nullable: true

    OnboardingAdvanceRequest:
      type: object
      required: [branch_id, step_id]
      properties:
        branch_id:
          type: string
          format: uuid
        step_id:
          type: string
          enum: [branch_draft, integrations, team, telegram, knowledge, booking, go_no_go]

    ConfirmationAction:
      type: string
      enum: [knowledge_rollback, branch_deactivate]

    ConfirmationTargetType:
      type: string
      enum: [knowledge_version, branch]

    ConfirmationCreateRequest:
      type: object
      required: [action, target_type, target_id, reason]
      properties:
        action:
          $ref: "#/components/schemas/ConfirmationAction"
        target_type:
          $ref: "#/components/schemas/ConfirmationTargetType"
        target_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500

    ConfirmationResponse:
      type: object
      required: [confirmation_id, action, target_type, target_id, expires_at]
      properties:
        confirmation_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/ConfirmationAction"
        target_type:
          $ref: "#/components/schemas/ConfirmationTargetType"
        target_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        client:
          $ref: "#/components/schemas/Client"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        clients:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        company_selection_required:
          type: boolean
        selection_required:
          type: boolean
        branch_selection_required:
          type: boolean
        selected_company_id:
          type: string
          format: uuid
          nullable: true
        selected_branch_id:
          type: string
          format: uuid
          nullable: true

    # ── Cases ──
    Case:
