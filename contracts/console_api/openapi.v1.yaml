# ════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    idempotency_key:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable key for safe retries of mutating requests.
      schema:
        type: string
        maxLength: 128
    client_id_header:
      name: X-Client-Id
      in: header
      required: false
      description: Client selection when identity maps to multiple clients.
      schema:
        type: string
        format: uuid
    branch_id_header:
      name: X-Branch-Id
      in: header
      required: false
      description: Branch selection when identity is branch-scoped or multiple branches exist.
      schema:
        type: string
        format: uuid
    branch_id_query:
      name: branch_id
      in: query
      required: false
      description: Optional branch override for branch-scoped operations.
      schema:
        type: string
        format: uuid
    case_id:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "39af8e47-a062-4b81-8343-34bdc3084ef9"
    agent_id:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: "f0b1a4c7-8f33-4f92-9b1f-9fe0f3d3e7b1"
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Pagination cursor (opaque)
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: AUTH_REQUIRED
              message: Authentication required
              trace_id: abc123
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_PARAM
              message: Invalid parameter
              trace_id: abc123
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ACCESS_DENIED
              message: You do not have permission to perform this action
              trace_id: abc123
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_FOUND
              message: Case not found
              trace_id: abc123
    CaseAlreadyTaken:
      description: Case already assigned to another agent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CASE_ALREADY_TAKEN
              message: Case is already assigned to another agent
              details:
                assigned_to: John Doe
              trace_id: abc123
    NotAssigned:
      description: Case not assigned to current agent
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: NOT_ASSIGNED
              message: You must take the case before performing this action
              trace_id: abc123
    IdempotencyConflict:
      description: Idempotency key already used or in progress
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: Request already processed
              trace_id: abc123
    OnboardingStepRequired:
      description: Onboarding step required before this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: ONBOARDING_STEP_REQUIRED
              message: Complete previous onboarding step
              details:
                required_step: integrations
              trace_id: abc123
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INVALID_STATE
              message: Action conflicts with current state
              trace_id: abc123
    ConfirmationRequired:
      description: Confirmation required for destructive action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: CONFIRMATION_REQUIRED
              message: Confirmation required
              details:
                action: knowledge_rollback
              trace_id: abc123
    ValidationError:
      description: Request validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    # ── Errors ──
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable message
        details:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        trace_id:
          type: string
          description: Correlation ID for debugging

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"

    FastAPIErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationErrorItem:
      type: object
      additionalProperties: true

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    # ── Auth ──
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [platform_admin, owner, admin, manager, support, specialist, viewer]
        client_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
          description: Required when role=manager or specialist.
        is_active:
          type: boolean

    AgentIdentity:
      type: object
      properties:
        channel:
          type: string
          enum: [telegram]
        external_id:
          type: string
        username:
          type: string
          nullable: true
        linked_at:
          type: string
          format: date-time
          nullable: true

    AgentWithIdentities:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [platform_admin, owner, admin, manager, support, specialist, viewer]
        client_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        identities:
          type: array
          items:
            $ref: "#/components/schemas/AgentIdentity"

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true

    CompanyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true

    CompanyCreateResponse:
      type: object
      properties:
        company:
          $ref: "#/components/schemas/Company"

    CompanyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        billing_info:
          type: object
          additionalProperties: true
          nullable: true
    CompanyListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        cursor:
          type: string
          nullable: true
        has_more:
          type: boolean

    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          nullable: true
        lifecycle_state:
          type: string
          enum: [lead, contracting, onboarding, go_live_ready, active, paused, archived]
          nullable: true
        payment_status:
          type: string
          enum: [pending, confirmed, rejected, unknown]
          nullable: true
        commercial_state:
          type: string
          enum: [contract_missing, payment_pending, payment_confirmed, payment_rejected]
          nullable: true
        service_state:
          type: string
          enum: [ok, degraded, attention]
          nullable: true
        owner_name:
          type: string
          nullable: true
        next_action:
          type: string
          nullable: true
        total_branches:
          type: integer
          nullable: true
        active_branches:
          type: integer
          nullable: true
        degraded_branches:
          type: integer
          nullable: true
        go_live_ready_branches:
          type: integer
          nullable: true

    ClientCreateRequest:
      type: object
      required: [slug, company_id]
      properties:
        slug:
          type: string
        company_id:
          type: string
          format: uuid
        status:
          type: string
          nullable: true

    ClientCreateResponse:
      type: object
      properties:
        client:
          $ref: "#/components/schemas/Client"

    ClientUpdateRequest:
      type: object
      properties:
        slug:
          type: string
        company_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          nullable: true

    ClientLifecycleActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string

    ClientListResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Client"
        cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        summary:
          $ref: "#/components/schemas/FleetSummary"
          nullable: true

    FleetSummary:
      type: object
      required:
        [
          total_companies,
          total_clients,
          active_clients,
          onboarding_clients,
          archived_clients,
          paused_clients,
          go_live_ready_clients,
          degraded_clients,
          payment_pending_clients,
          payment_confirmed_clients,
          lifecycle_counts,
          payment_counts,
          service_counts,
        ]
      properties:
        total_companies:
          type: integer
        total_clients:
          type: integer
        active_clients:
          type: integer
        onboarding_clients:
          type: integer
        archived_clients:
          type: integer
        paused_clients:
          type: integer
        go_live_ready_clients:
          type: integer
        degraded_clients:
          type: integer
        payment_pending_clients:
          type: integer
        payment_confirmed_clients:
          type: integer
        lifecycle_counts:
          type: object
          additionalProperties:
            type: integer
        payment_counts:
          type: object
          additionalProperties:
            type: integer
        service_counts:
          type: object
          additionalProperties:
            type: integer

    FleetAttentionItem:
      type: object
      required:
        [
          client_id,
          client_slug,
          lifecycle_state,
          payment_status,
          commercial_state,
          service_state,
          next_action,
          attention_score,
          attention_level,
        ]
      properties:
        client_id:
          type: string
          format: uuid
        client_slug:
          type: string
        client_name:
          type: string
          nullable: true
        company_id:
          type: string
          format: uuid
          nullable: true
        company_name:
          type: string
          nullable: true
        lifecycle_state:
          type: string
          enum: [lead, contracting, onboarding, go_live_ready, active, paused, archived]
        payment_status:
          type: string
          enum: [pending, confirmed, rejected, unknown]
        commercial_state:
          type: string
          enum: [contract_missing, payment_pending, payment_confirmed, payment_rejected]
        service_state:
          type: string
          enum: [ok, degraded, attention]
        owner_name:
          type: string
          nullable: true
        next_action:
          type: string
        total_branches:
          type: integer
          default: 0
        active_branches:
          type: integer
          default: 0
        degraded_branches:
          type: integer
          default: 0
        go_live_ready_branches:
          type: integer
          default: 0
        stale_branches:
          type: integer
          default: 0
        integration_error_branches:
          type: integer
          default: 0
        integration_warn_branches:
          type: integer
          default: 0
        outbox_failed_24h:
          type: integer
          default: 0
        pending_handovers:
          type: integer
          default: 0
        attention_score:
          type: integer
        attention_level:
          type: string
          enum: [high, medium, low]
        reasons:
          type: array
          items:
            type: string
          default: []
        suggested_actions:
          type: array
          items:
            type: string
          default: []

    FleetAttentionSummary:
      type: object
      required:
        [
          active_clients_total,
