                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - console
      summary: Create Inbox Macro
      operationId: create_inbox_macro_console_v1_inbox_macros_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleMacroCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleMacroCreateResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Forbidden
        '422':
