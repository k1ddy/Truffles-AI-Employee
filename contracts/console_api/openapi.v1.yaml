openapi: "3.1.0"
info:
  title: Truffles Console API
  version: "1.0.0"
  description: |
    BFF API for Truffles Internal Console.
    - All endpoints require OIDC Bearer token
    - Tenant/branch isolation enforced server-side
    - Cursor-based pagination on all list endpoints
    - Idempotent mutations via Idempotency-Key header

servers:
  - url: /console/v1
    description: Console API v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication and context
  - name: admin
    description: Platform admin operations
  - name: cases
    description: Case management (Inbox)
  - name: messages
    description: Messages within cases
  - name: agents
    description: Agent directory and identity linking
  - name: settings
    description: Client/branch settings
  - name: calendar
    description: Specialists, slots, bookings, and calendar integrations
  - name: knowledge
    description: Knowledge Studio pipeline
  - name: ops
    description: Operations and health
  - name: audit
    description: Audit log
  - name: integrations
    description: Connector setup and verification

paths:
  # ──────────────────────────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────────────────────────
  /me:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current agent context
      description: Returns authenticated agent info, active client, accessible branches, and client list
      responses:
        "200":
          description: Agent context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ──────────────────────────────────────────────────────────────────
  # AGENTS
  # ──────────────────────────────────────────────────────────────────
  /agents:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: listAgents
      tags: [agents]
      summary: List agents with identities
      description: Returns agents and linked identities (e.g., telegram)
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/FastAPIErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agents/{agent_id}/telegram/link:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
      - $ref: "#/components/parameters/agent_id"
    post:
      operationId: linkAgentTelegram
      tags: [agents]
      summary: Generate Telegram linking token
      description: Returns a short token and deep-link for Telegram account linking.
      responses:
        "200":
          description: Link token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OnboardingStepRequired"

  # ──────────────────────────────────────────────────────────────────
  # CASES (INBOX)
  # ──────────────────────────────────────────────────────────────────
  /cases:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: listCases
      tags: [cases]
      summary: List cases (Inbox)
      description: Cursor-paginated list of handover cases with filters
      parameters:
        - name: status
          in: query
          description: Case status filter. `open` matches `pending` + `active`.
          schema:
            type: string
            enum: [open, pending, active, resolved]
        - name: q
          in: query
          schema:
            type: string
            maxLength: 128
        - name: branch_id
          in: query
          schema:
            type: string
            format: uuid
        - name: assigned_to_me
          in: query
          schema:
            type: boolean
            default: false
        - name: phone
          in: query
          schema:
            type: string
        - name: has_delivery_error
          in: query
          schema:
            type: boolean
            default: false
        - name: has_pending_outbox
          in: query
          schema:
            type: boolean
            default: false
        - name: last_activity_since
          in: query
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Sort order for inbox results.
          schema:
            type: string
            enum: [last_activity, created_at, sla]
            default: last_activity
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Case list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /cases/{case_id}:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getCase
      tags: [cases]
      summary: Get case details
      parameters:
        - $ref: "#/components/parameters/case_id"
      responses:
        "200":
          description: Case details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Case"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /cases/{case_id}/take:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: takeCase
      tags: [cases]
      summary: Take ownership of a case
      description: |
        Assigns case to current agent. Returns 409 if already taken.
        Idempotent via Idempotency-Key header.
      parameters:
        - $ref: "#/components/parameters/case_id"
        - $ref: "#/components/parameters/idempotency_key"
      responses:
        "200":
          description: Case taken successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseActionResponse"
        "409":
          description: Case already taken or idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cases/{case_id}/resolve:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: resolveCase
      tags: [cases]
      summary: Resolve and close a case
      description: Marks case as resolved. Must be assigned to current agent or owner/admin.
      parameters:
        - $ref: "#/components/parameters/case_id"
        - $ref: "#/components/parameters/idempotency_key"
      responses:
        "200":
          description: Case resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseActionResponse"
        "403":
          $ref: "#/components/responses/NotAssigned"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /cases/{case_id}/return:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: returnCase
      tags: [cases]
      summary: Return case to bot
      description: Returns case to bot and closes the handover.
      parameters:
        - $ref: "#/components/parameters/case_id"
        - $ref: "#/components/parameters/idempotency_key"
      responses:
        "200":
          description: Case returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseActionResponse"
        "403":
          $ref: "#/components/responses/NotAssigned"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  # ──────────────────────────────────────────────────────────────────
  # MESSAGES
  # ──────────────────────────────────────────────────────────────────
  /cases/{case_id}/messages:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getCaseMessages
      tags: [messages]
      summary: Get messages for a case
      parameters:
        - $ref: "#/components/parameters/case_id"
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: sendManagerMessage
      tags: [messages]
      summary: Send message from manager to customer
      description: |
        Sends via outbox → WhatsApp. Case must be active and assigned.
        Idempotent via Idempotency-Key header.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "e03933eb-780e-4d0d-890f-741bc3ca9733"
        - $ref: "#/components/parameters/idempotency_key"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Message queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "403":
          $ref: "#/components/responses/NotAssigned"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /conversations/{conversation_id}/messages/media:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: sendManagerMedia
      tags: [messages]
      summary: Send media from manager to customer
      description: |
        Uploads a media file and sends it to WhatsApp via outbox (or direct send when outbox is disabled).
        Allowed types: photo, audio, document. Video is forbidden.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "e03933eb-780e-4d0d-890f-741bc3ca9733"
        - $ref: "#/components/parameters/idempotency_key"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/SendMediaRequest"
      responses:
        "200":
          description: Media accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/NotAssigned"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  # ──────────────────────────────────────────────────────────────────
  # INBOX MACROS
  # ──────────────────────────────────────────────────────────────────
  /inbox/macros:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: listInboxMacros
      tags: [inbox]
      summary: List inbox macros
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Macro list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMacroListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createInboxMacro
      tags: [inbox]
      summary: Create inbox macro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxMacroCreateRequest"
      responses:
        "200":
          description: Macro created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMacroCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /inbox/macros/{macro_id}:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
      - name: macro_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateInboxMacro
      tags: [inbox]
      summary: Update inbox macro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxMacroUpdateRequest"
      responses:
        "200":
          description: Macro updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMacro"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────
  # OPS / HEALTH
  # ──────────────────────────────────────────────────────────────────
  /health:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getHealth
      tags: [ops]
      summary: System health check
      security: []  # Public endpoint
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics/daily:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getMetricsDaily
      tags: [ops]
      summary: Daily case metrics
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Defaults to today
        - name: trend_days
          in: query
          schema:
            type: integer
            minimum: 3
            maximum: 60
          description: Trend window size (defaults to 7)
      responses:
        "200":
          description: Daily metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsDailyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /business/summary:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getBusinessSummary
      tags: [ops]
      summary: Owner/Admin business summary
      responses:
        "200":
          description: Business control summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /business/data-trust:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getBusinessDataTrust
      tags: [ops]
      summary: Owner/Admin data trust summary
      responses:
        "200":
          description: Data trust and governance summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /business/team-performance:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getBusinessTeamPerformance
      tags: [ops]
      summary: Owner/Admin team performance summary
      responses:
        "200":
          description: Team workload and responsiveness summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /subscription/summary:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getSubscriptionSummary
      tags: [ops]
      summary: Owner/Admin subscription summary
      responses:
        "200":
          description: Subscription usage and billing evidence summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /telegram/health:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getTelegramHealth
      tags: [ops]
      summary: Telegram connector health
      responses:
        "200":
          description: Telegram health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramHealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /telegram/verify:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: verifyTelegramConnector
      tags: [integrations]
      summary: Send verification message to Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramVerifyRequest"
      responses:
        "200":
          description: Verification message result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramVerifyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/OnboardingStepRequired"

  /telegram/test:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: sendTelegramTest
      tags: [integrations]
      summary: Send test message to Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramTestRequest"
      responses:
        "200":
          description: Test message result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramTestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConfirmationRequired"

  /ops/outbox:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: listOutbox
      tags: [ops]
      summary: Outbox queue (pending/processing/failed)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, failed, all]
          description: "Filter by outbox status (default: failed)"
        - name: cursor
          in: query
          schema:
            type: string
          description: ISO timestamp cursor for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Outbox list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ops/outbox/retry:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    post:
      operationId: retryOutbox
      tags: [ops]
      summary: Retry failed outbox messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxRetryRequest"
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxRetryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ops/jobs/catalog:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getOpsJobsCatalog
      tags: [ops]
      summary: Get ops jobs catalog
      responses:
        "200":
          description: Available ops jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobCatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ops/jobs:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: listOpsJobs
      tags: [ops]
      summary: List ops job history
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: ISO timestamp cursor for pagination
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Ops jobs history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsJobListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /ops/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/client_id_header"
      - $ref: "#/components/parameters/branch_id_header"
    get:
      operationId: getOpsJob
      tags: [ops]
      summary: Get ops job details
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ops job record
          content:
            application/json:
              schema:
