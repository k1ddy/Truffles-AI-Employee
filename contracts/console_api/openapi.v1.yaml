openapi: 3.1.0
info:
  title: Truffles Console API
  description: 'BFF API for Truffles Internal Console.

    - All endpoints require OIDC Bearer token

    - Tenant/branch isolation enforced server-side

    - Cursor-based pagination on all list endpoints

    - Idempotent mutations via Idempotency-Key header

    '
  version: 1.0.0
paths:
  /console/v1/me:
    get:
      tags:
      - console
      summary: Get Me
      operationId: get_me_console_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleMeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
  /console/v1/agents:
    get:
      tags:
      - console
      summary: List Agents
      operationId: list_agents_console_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleAgentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
  /console/v1/agents/{agent_id}/telegram/link:
    post:
      tags:
      - console
      summary: Link Agent Telegram
      operationId: link_agent_telegram_console_v1_agents__agent_id__telegram_link_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleTelegramLinkResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Forbidden
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases:
    get:
      tags:
      - console
      summary: List Cases
      operationId: list_cases_console_v1_cases_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
      - name: assigned_to_me
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Assigned To Me
      - name: phone
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
      - name: has_delivery_error
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Has Delivery Error
      - name: has_pending_outbox
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Has Pending Outbox
      - name: last_activity_since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Activity Since
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort By
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCaseListResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}/take:
    post:
      tags:
      - console
      summary: Take Case
      operationId: take_case_console_v1_cases__case_id__take_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCaseActionResponse'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}/resolve:
