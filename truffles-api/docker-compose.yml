version: "3.8"

services:
  truffles-api:
    build:
      context: ..
      dockerfile: truffles-api/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: truffles-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - CONSOLE_OIDC_JWKS_URL=https://auth.truffles.kz/realms/truffles/protocol/openid-connect/certs
      - CONSOLE_OIDC_ISSUER=https://auth.truffles.kz/realms/truffles
      - CONSOLE_OIDC_AUDIENCE=console-web
    extra_hosts:
      - "auth.truffles.kz:172.20.0.2"
    networks:
      - truffles_internal-net
      - proxy-net
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.truffles-api.rule=Host(`api.truffles.kz`)"
      - "traefik.http.routers.truffles-api.entrypoints=websecure"
      - "traefik.http.routers.truffles-api.tls.certresolver=myresolver"
      - "traefik.http.services.truffles-api.loadbalancer.server.port=8000"
      - "traefik.docker.network=proxy-net"

  truffles-outbox:
    build:
      context: ..
      dockerfile: truffles-api/Dockerfile
    container_name: truffles-outbox
    command: python -m app.workers.outbox
    env_file:
      - .env
    environment:
      - DEBUG=false
    networks:
      - truffles_internal-net
    restart: unless-stopped
    deploy:
      replicas: 1

  truffles-sentinel:
    build:
      context: ..
      dockerfile: truffles-api/Dockerfile
    container_name: truffles-sentinel
    command: python -m app.workers.sentinel
    env_file:
      - .env
    environment:
      - DEBUG=false
    networks:
      - truffles_internal-net
    restart: unless-stopped
    deploy:
      replicas: 1

  console-web:
    build:
      context: ../console-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BUILD_SHA: ${GIT_COMMIT:-unknown}
        NEXT_PUBLIC_BUILD_TIME: ${BUILD_TIME:-unknown}
    container_name: truffles-console-web
    restart: unless-stopped
    env_file:
      - ../console-web/.env.local
    networks:
      - truffles_internal-net
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.console-web.rule=Host(`console.truffles.kz`)"
      - "traefik.http.routers.console-web.entrypoints=websecure"
      - "traefik.http.routers.console-web.tls.certresolver=myresolver"
      - "traefik.http.services.console-web.loadbalancer.server.port=3000"
      - "traefik.docker.network=proxy-net"

  landing-page:
    build:
      context: ../../landing-website
      dockerfile: Dockerfile
    container_name: truffles-landing-page
    restart: unless-stopped
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`truffles.kz`, `www.truffles.kz`)"
      - "traefik.http.routers.landing-page.entrypoints=websecure"
      - "traefik.http.routers.landing-page.tls.certresolver=myresolver"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-net"

networks:
  truffles_internal-net:
    external: true
  proxy-net:
    external: true
