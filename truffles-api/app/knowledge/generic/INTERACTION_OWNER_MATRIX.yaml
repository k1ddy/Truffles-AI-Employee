schema_version: interaction_owner_matrix.v1
matrix_id: remaining_closure_owner_matrix
source:
  parent_verdict_tp: docs/TASK_PACKAGES/TP-2026-03-09-p1.6o60a-remaining-closure-architecture-verdict-a1.md
  owner_matrix_tp: docs/TASK_PACKAGES/TP-2026-03-09-p1.6o60b-remaining-closure-owner-matrix-a1.md
  redesign_reset_tp: docs/TASK_PACKAGES/TP-2026-03-12-p1.6o79-executable-interaction-core-redesign-reset-a1.md
  canon_sync_tp: docs/TASK_PACKAGES/TP-2026-03-12-p1.6o80-base-canon-interaction-model-sync-a1.md
global_invariants:
  resume_axis_field: expected_reply_type
  interaction_target_field: pending_question_target
  interaction_relation_field: active_question_relation
  owner_field: interaction_owner
  one_interaction_owner_per_inbound: true
  relation_source: semantic_owner_or_boundary_validation_only
  allowed_degrade_requirements:
  - preserve_relation
  - preserve_resume_after_grounding_boundary
  - emit_reason_code
  - emit_decision_meta
  - emit_decision_trace
  forbidden_global_compressions:
  - generic_booking_prompt_without_relation_evidence
  - generic_master_truth_as_live_availability_success
  - reopen_service_choice_after_grounded_service_on_pricing_interrupt
  - silent_loss_of_active_pending_question_contract
row_status_legend:
  closed: row closed by canonical contract or higher-level mechanism
  closed_bounded: row closed locally with bounded closure; fresh guarded rerun moved
    to a different family
  open: row remains unresolved and requires a follow-up implementation block
admission_rules:
  one_child_tp_per_row: true
  child_tp_must_name_matrix_row: true
  guarded_rerun_requires:
  - semantic_contract_output
  - owner_arbitration_boundary
  - degrade_path
  - adjacent_negative_row
