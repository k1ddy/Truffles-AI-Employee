  - id: brows_lashes_care
    title: Уход за бровями и ресницами
    summary: Базовый уход за бровями и ресницами без процедур.
    allowed_advice:
      - Мягкое очищение без трения.
      - Увлажнение кожи вокруг и аккуратное расчесывание.
      - Избегать активного трения и агрессивного снятия макияжа.
    required_questions:
      - Уход нужен после процедуры или в повседневной рутине?
    optional_questions:
      - Есть ли чувствительность кожи вокруг глаз?
    disallowed_claims:
