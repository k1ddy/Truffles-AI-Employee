    title: Референс и стиль
    summary: Обсуждение желаемого образа по фото или референсу.
    allowed_advice:
      - Сначала выбрать направление и уровень контраста.
      - Обсудить технику, которая даст похожее ощущение.
      - Начать с мягкого варианта и оценить результат.
    required_questions:
