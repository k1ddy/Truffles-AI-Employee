  - id: sensitive_skin
    title: Чувствительная кожа
    summary: Мягкий уход для чувствительной кожи и снижение раздражения.
    allowed_advice:
      - Выбирать щадящие процедуры и мягкое очищение.
      - Пробовать новые средства по одному и наблюдать реакцию.
      - Избегать агрессивных пилингов и скрабов.
    required_questions:
      - Где проявляется чувствительность и как давно?
    optional_questions:
      - Есть ли известные триггеры или процедуры, на которые реагируете?
