[project]
name = "truffles-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "python-multipart==0.0.9",
    "uvicorn==0.27.0",
    "sqlalchemy==2.0.25",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "httpx==0.26.0",
    "PyYAML==6.0.2",
    "redis==5.0.8",
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "dateparser==1.2.0",
    "rapidfuzz==3.9.6",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "E712",  # comparison to True (SQLAlchemy uses this)
    "W293",  # blank line contains whitespace (docstrings)
    "F401",  # unused imports (re-exports in __init__.py)
    "F841",  # local variable assigned but never used
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
