openapi: 3.1.0
info:
  title: Truffles API
  description: Backend service for Truffles chatbot
  version: 0.1.0
paths:
  /message:
    post:
      summary: Handle Message
      description: Handle incoming message through the shared webhook pipeline.
      operationId: handle_message_message_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /callback:
    post:
      summary: Handle Callback
      description: Handle manager callback action (take/resolve/skip/return).
      operationId: handle_callback_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reminders:
    get:
      summary: Get Reminders
      description: Get list of handovers that need reminders.
      operationId: get_reminders_reminders_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemindersResponse'
  /reminders/{handover_id}/sent:
    post:
      summary: Reminder Sent
      description: Mark reminder as sent.
      operationId: reminder_sent_reminders__handover_id__sent_post
      parameters:
      - name: handover_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Handover Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderSentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderSentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reminders/process:
    post:
      summary: Process All Reminders
      description: 'Process and send all pending reminders to Telegram.


        Call this endpoint from cron every minute.'
      operationId: process_all_reminders_reminders_process_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /media/{media_path}:
    get:
      summary: Serve Media
      description: Serve locally stored media via signed URLs.
      operationId: serve_media_media__media_path__get
      parameters:
      - name: media_path
        in: path
        required: true
        schema:
          type: string
          title: Media Path
      - name: expires
        in: query
        required: true
        schema:
          type: integer
          title: Expires
      - name: sig
        in: query
        required: true
        schema:
          type: string
          title: Sig
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook/debug:
    post:
      summary: Debug Webhook
      description: Debug endpoint to see raw request.
      operationId: debug_webhook_webhook_debug_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /webhook/{client_slug}:
    post:
      summary: Handle Webhook Direct
      description: Handle direct ChatFlow webhook without wrapper.
      operationId: handle_webhook_direct_webhook__client_slug__post
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: Handle Webhook Probe
      description: Health probe for ChatFlow UI checks; real webhooks must use POST.
      operationId: handle_webhook_probe_webhook__client_slug__get
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /webhook:
    post:
      summary: Handle Webhook
      description: Handle legacy webhook wrapper (same format as ChatFlow webhook).
      operationId: handle_webhook_webhook_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /telegram-webhook:
    post:
      summary: Handle Telegram Webhook
      description: 'Handle Telegram webhook updates:

        - Text messages from managers -> forward to WhatsApp client

        - Callback queries (button clicks) -> process callback action'
      operationId: handle_telegram_webhook_telegram_webhook_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramWebhookResponse'
  /telegram-callback:
    post:
      summary: Handle Telegram Callback
      operationId: handle_telegram_callback_telegram_callback_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramWebhookResponse'
  /alerts/test:
    post:
      summary: Alerts Test
      operationId: alerts_test_alerts_test_post
      parameters:
      - name: X-Admin-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/prompt/{client_slug}:
    get:
      tags:
      - admin
      summary: Get Prompt
      description: Get current system prompt for client.
      operationId: get_prompt_admin_prompt__client_slug__get
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - admin
      summary: Update Prompt
      description: 'Update system prompt for client.


        Validation:

        - Client must exist

        - Prompt text must not be empty

        - Prompt text must be < 10000 chars'
      operationId: update_prompt_admin_prompt__client_slug__put
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromptUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/settings/{client_slug}:
    get:
      tags:
      - admin
      summary: Get Settings
      description: Get client settings.
      operationId: get_settings_admin_settings__client_slug__get
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - admin
      summary: Update Settings
      description: 'Update client settings.


        Validation:

        - mute_duration_first_minutes: 1-120

        - mute_duration_second_hours: 1-72

        - reminder_1_minutes: 5-60

        - reminder_2_minutes: 30-180

        - branch_resolution_mode: by_instance/ask_user/hybrid

        - manager_scope: branch/global

        - auto_approve_roles: owner/admin/manager/support'
      operationId: update_settings_admin_settings__client_slug__put
      parameters:
      - name: client_slug
        in: path
        required: true
        schema:
          type: string
          title: Client Slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/outbox/process:
    post:
      tags:
      - admin
      summary: Process Outbox
      operationId: process_outbox_admin_outbox_process_post
      parameters:
      - name: X-Admin-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/media/cleanup:
    post:
      tags:
      - admin
      summary: Cleanup Media
      operationId: cleanup_media_admin_media_cleanup_post
      parameters:
      - name: ttl_days
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ttl Days
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      - name: X-Admin-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaCleanupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/knowledge-backlog:
    get:
      tags:
      - admin
      summary: Get Knowledge Backlog
      operationId: get_knowledge_backlog_admin_knowledge_backlog_get
      parameters:
      - name: client_slug
        in: query
        required: true
        schema:
          type: string
          title: Client Slug
      - name: days
        in: query
        required: false
        schema:
          type: integer
          default: 7
          title: Days
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: X-Admin-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/metrics:
    get:
      tags:
      - admin
      summary: Get Metrics
      operationId: get_metrics_admin_metrics_get
      parameters:
      - name: client_slug
        in: query
        required: true
        schema:
          type: string
          title: Client Slug
      - name: metric_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Metric Date
      - name: X-Admin-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/health:
    get:
      tags:
      - admin
      summary: System Health
      description: Get system health status.
      operationId: system_health_admin_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /admin/heal:
    post:
      tags:
      - admin
      summary: Heal System
      description: Check and heal invariant violations.
      operationId: heal_system_admin_heal_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /admin/version:
    get:
      tags:
      - admin
      summary: Get Version
      description: Return build metadata for diagnostics.
      operationId: get_version_admin_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
  /console/v1/me:
    get:
      tags:
      - console
      summary: Get Me
      operationId: get_me_console_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleMeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
  /console/v1/cases:
    get:
      tags:
      - console
      summary: List Cases
      operationId: list_cases_console_v1_cases_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
      - name: assigned_to_me
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Assigned To Me
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCaseListResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Unauthorized
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}/take:
    post:
      tags:
      - console
      summary: Take Case
      operationId: take_case_console_v1_cases__case_id__take_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCaseActionResponse'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}/resolve:
    post:
      tags:
      - console
      summary: Resolve Case
      operationId: resolve_case_console_v1_cases__case_id__resolve_post
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCaseActionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}/messages:
    get:
      tags:
      - console
      summary: Get Case Messages
      operationId: get_case_messages_console_v1_cases__case_id__messages_get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleMessageListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/cases/{case_id}:
    get:
      tags:
      - console
      summary: Get Case
      description: Get single case details by ID.
      operationId: get_case_console_v1_cases__case_id__get
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleCase'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/conversations/{conversation_id}/messages:
    post:
      tags:
      - console
      summary: Send Manager Message
      description: Send a message from the manager to the customer via WhatsApp.
      operationId: send_manager_message_console_v1_conversations__conversation_id__messages_post
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleManagerMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleManagerMessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/health:
    get:
      tags:
      - console
      summary: Get Health
      description: Get system health status.
      operationId: get_health_console_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleHealthResponse'
  /console/v1/audit:
    get:
      tags:
      - console
      summary: List Audit Events
      description: List audit events for the current client.
      operationId: list_audit_events_console_v1_audit_get
      parameters:
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Type
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Entity Id
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleAuditListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/settings:
    get:
      tags:
      - console
      summary: Get Settings
      description: 'Get settings info: branches, agents, and bot config for the current
        client.'
      operationId: get_settings_console_v1_settings_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSettingsResponse'
    patch:
      tags:
      - console
      summary: Update Settings
      description: Update client settings (owner/admin only).
      operationId: update_settings_console_v1_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsoleSettingsUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleSettingsUpdateResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/metrics/daily:
    get:
      tags:
      - console
      summary: Get Metrics Daily
      description: Get daily metrics for cases.
      operationId: get_metrics_daily_console_v1_metrics_daily_get
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleMetricsDailyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /console/v1/calendar/specialists:
    get:
      tags:
      - Calendar
      summary: List Specialists
      description: Get all specialists for the client.
      operationId: list_specialists_console_v1_calendar_specialists_get
      parameters:
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Branch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialistsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
