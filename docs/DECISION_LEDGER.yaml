    validation:
      - python3 -m py_compile ops/diagnose.py truffles-api/tests/test_booking_quality_status_gate.py
      - targeted pytest for quality-constant transport policy and rendered reply evidence
      - corrected Tranche A run returned artifact_integrity.valid=true and decision trace coverage 1.0
      - strict Acceptance gate rejects transport_evidence_policy=rendered
      - post-ledger release topology and observability truth returned valid=true after runtime profile restart
      - post-ledger go-live data truth returned valid=true; provider truth remained valid=false for CHATFLOW_WHATSAPP_COMMERCIALLY_UNAVAILABLE
    known_limits:
      - Rendered transport evidence is allowed only for dev Exploration and cannot prove provider delivery.
      - Tranche A used only 3 dialogs / 14 turns and is not a full Pack v0 run.
      - Tranche A manual audit is complete, but human_semantic_valid=false; it remains diagnostic only.
