      - The single bs-004 mismatch is a labeling dispute, not a v3 quality issue; both `fact_question` and `unsupported` are reasonable salon-side framings of "service we do not offer". Owner decides which is canonical.
      - The aggregator's semantic_match calls do not pass state_slots / required_for_booking, so the booking_request/slot_collect discriminator is intentionally lenient (accepts either). Phase D will tighten this once corpus turns carry full state lineage.
