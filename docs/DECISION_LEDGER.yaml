  - id: DL-2026-05-04-006
    date: 2026-05-04
    capability: BSV1-06 Handoff / Quality Governance
    architecture_layer: Handoff Lifecycle + Quality Oracle + Manager Simulation
    problem: >
      Pack v0 Tranche B `FAM-B2` mixed product behavior with evidence-tool
      drift. Runtime correctly creates pending-state handoff lifecycle for
      cancel/reschedule/admin-confirm flows, but the scenario oracle could keep
      `bot_active` expectations for follow-up context turns, and automatic
      manager simulation could take/resolve a handoff before the remaining
      customer context was appended. Older manager checks also treated
      `take -> manager_active` as deterministic even though the simulation can
      race with resolution.
    decision: >
      Repair the evidence contract, not the semantic owner. Booking-manage
      cancel/reschedule handoff starts a management context in scenario
      sanitation; service/date/time/name/phone/human follow-ups remain
      `HANDOFF` context with `pending` state expectations instead of booking
      collect expectations. The quality oracle accepts handoff-effect pending
      state when the owner/action/tool evidence is handoff. Automatic manager
      simulation is delayed until no later customer turn remains, and `take`
      is race-tolerant while `resolve` still requires `bot_active/resolved`.
      This is a focused lifecycle/oracle proof, not Pack v0 Acceptance.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
      - docs/SESSION_START_PROMPT.txt
      - TECH.md
      - ops/diagnose.py
      - truffles-api/app/services/llm_quality_contracts.py
      - truffles-api/tests/test_booking_dialog_scenarios_script.py
      - truffles-api/tests/test_booking_quality_state_fallback.py
    proof_artifacts:
