  - id: DL-2026-05-04-005
    date: 2026-05-04
    capability: BSV1-06 Handoff / BSV1-04 Booking manage
    architecture_layer: Policy Core + Boundary Validation + Handoff Lifecycle
    problem: >
      Pack v0 Tranche B showed two P0 shared mechanism failures. Cancel,
      reschedule, and admin-confirmation requests could be routed as
      `FACT/calendar.get_booking` or executable cancel/reschedule semantics
      instead of admin-confirmation handoff. After complaint, medical, refund,
      or human handoff, a bare name/phone follow-up could be reclassified as a
      new booking collect rather than attached to the active handoff context.
    decision: >
      Repair the governed policy-core contract for the two P0 families. Pack
      policy sections for cancel/reschedule/payment/medical/complaint and
      explicit human requests now force `HANDOFF` through policy-core with
      `tool_action_hint=handoff`; customer chat must not execute
      `calendar.cancel` or `calendar.reschedule`. Handoff contact follow-ups
      attach name/phone to the active handoff context instead of reopening
      booking collect. Boundary validation rejects customer-side
      cancel/reschedule tool execution. This is a focused P0 mechanism proof,
      not Beauty Salon v1 product acceptance.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
      - docs/SESSION_START_PROMPT.txt
      - TECH.md
      - truffles-api/app/services/intent_service.py
      - truffles-api/app/services/policy_prompt_snapshot_service.py
      - prompts/llm_policy_core.md
      - truffles-api/tests/test_intent.py
    proof_artifacts:
