      - /tmp/truffles_real_world_salon_pack_20260504/p0_handoff_repair_20260504a/artifacts/fam_b1_active_cancel_interrupt.json
      - /tmp/truffles_real_world_salon_pack_20260504/p0_handoff_repair_20260504a/artifacts/fam_b1_direct_cancel_identity.json
      - /tmp/truffles_real_world_salon_pack_20260504/p0_handoff_repair_20260504a/artifacts/fam_b1_reschedule_identity.json
      - /tmp/truffles_real_world_salon_pack_20260504/p0_handoff_repair_20260504a/artifacts/fam_b3_complaint_contact.json
      - /tmp/truffles_real_world_salon_pack_20260504/p0_handoff_repair_20260504a/artifacts/fam_b3_medical_contact.json
      - /tmp/truffles_real_world_salon_pack_20260504/release_topology_truth_p0_handoff_20260504a.json
    validation:
      - python3 -m py_compile truffles-api/app/services/intent_service.py truffles-api/app/services/policy_prompt_snapshot_service.py truffles-api/tests/test_intent.py
      - targeted pytest for booking-manage admin handoff, handoff contact continuation, and prompt snapshot contracts returned 15 passed
      - broader targeted pytest for booking_manage/handoff/cancel/reschedule/medical/complaint returned 31 passed
      - focused family proof summary returned valid=true for 5 dialogs covering FAM-B1 and FAM-B3
      - release_topology_truth returned valid=true on runtime image truffles-local:real-world-p0-handoff-20260504a
      - decision_ledger_guard, product_work_map_guard, tool_inventory_guard, single_semantic_owner_guard, and semantic_preflight returned valid/OK
      - go_live_data_truth and observability_truth returned valid=true; provider_integration_truth remained valid=false for CHATFLOW_WHATSAPP_COMMERCIALLY_UNAVAILABLE
      - arch_guard failed only on stale docs/_generated/AGENT_PACKET.json, which remains intentionally untouched
    known_limits:
      - Focused proof covers exact P0 families only; it is not Real-World Salon Acceptance Pack closure.
      - Full `truffles-api/tests/test_intent.py` still contains many stale/failing expectations outside this repair slice and must be triaged by family before broad acceptance.
      - FAM-B2 handoff lifecycle/oracle/manager-state contract remains open.
      - Chatflow/WhatsApp remains commercially unavailable; focused proof uses internal webhook/runtime evidence, not external provider delivery.
    do_not_repeat:
      - Do not route customer cancel/reschedule/admin-confirmation to customer-side `calendar.cancel` or `calendar.reschedule`.
