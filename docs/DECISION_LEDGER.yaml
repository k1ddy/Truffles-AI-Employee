  - id: DL-2026-05-11-018
    date: 2026-05-11
    capability: Platform Architecture / Policy-Core v3 / Shadow-Run Observability
    architecture_layer: Shadow-run module (extension B.1.5); legacy code untouched
    problem: >
      The Phase B.1 ComparisonRecord carried `legacy_summary` as a freeform
      dict, which would let scenario drift creep into the comparison surface
      and force every consumer (corpus runner, metrics, manual audit) to
      reimplement the same projection. There was also no typed divergence
      classifier, so Phase B.3 corpus analysis would have to derive it ad
      hoc from raw records.
    decision: >
      Add a typed `LegacySummary` pydantic model with a stable field set
      (intent, action, tool_action, message_text, rescue_flag,
      policy_core_degrade, degrade_reason, latency_ms, extras) and a pure
      `compute_divergence(legacy, v3_outcome) -> Divergence` classifier
      with a closed flag vocabulary (intent_match, intent_mismatch,
      legacy_rescue, legacy_degrade, v3_degrade, both_degrade,
      v3_decision_while_legacy_degrade, legacy_decision_while_v3_degrade,
      tool_action_match, tool_action_mismatch, high_uncertainty). Update
      ComparisonRecord and run_shadow to use the typed contract and attach
      a Divergence per record. No legacy code touched; the projection from
      a real legacy IntentResponse to LegacySummary belongs to the future
      consultant_runtime hook (Phase B.2).
    classification: REPAIR
    changed_files:
