    capability: Platform Architecture Governance / Cross-Vertical Scalability / Quality Governance
    architecture_layer: Product Canon + Architecture Specs + Agent Boot Protocol + Tool Inventory Governance
    problem: >
      The project risk shifted from one failing salon dialog to a broader
      architecture-understanding gap: future humans and agents could misread
      Truffles as a chatbot, adopt LangChain/LangGraph as a substitute for
      product architecture, delete deterministic evidence extraction because
      the model can infer language, or keep adding niche-specific semantic
      branches to core. That would block the target of a scalable, manageable,
      observable business capability platform.
    decision: >
      Repair durable governance docs to state the canonical platform contract:
      Truffles core is a business capability platform; Beauty Salon v1 is the
      first proof vertical; future niches extend through packs, capabilities,
      tool/data contracts, operational DB rows, and governed retrieval
      projections. External orchestration frameworks are optional workflow
      tools only and require a bounded adoption gate. Lexicons, regex, aliases,
      normalizers, and RAG are evidence/candidate-fact layers only, not semantic
      owners. Runtime implementation remains subject to the existing hot path,
      single-owner, boundary, state, tool, Console, and observability contracts.
