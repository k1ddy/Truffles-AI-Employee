  - id: DL-2026-05-11-019
    date: 2026-05-11
    capability: Platform Architecture / Policy-Core v3 / Shadow-Run Production Sink + Projector
    architecture_layer: Shadow-run module (extension B.2.a); legacy code untouched
    problem: >
      Phase B.2.b will need a production-grade artifact sink (JSONL on disk)
      and a stable projection from legacy IntentResponse-like objects to
      LegacySummary. Shipping these with the consultant_runtime hook in one
      session would mix infrastructure with hot-path surgery and increase
      review/rollback risk on the 2,100-line god-class.
    decision: >
      Land the JSONL sink and a defensive legacy projector as isolated
      additions to truffles-api/app/policy_core_v3_shadow/. Both are pure
      modules: no DB, no LLM, no consultant_runtime imports. The sink uses
      asyncio.Lock and asyncio.to_thread to avoid blocking the hot path,
      auto-creates parent directories, and writes one JSON line per record.
      The projector defensively maps a stable, closed set of attribute name
      candidates (intent / intent_value / intent_name; tool_action / tool_id /
      tool; rescue / rescue_flag / is_rescue; etc.) onto LegacySummary
      fields, with safe defaults for missing or invalid values.
    classification: REPAIR
    changed_files:
      - truffles-api/app/policy_core_v3_shadow/jsonl_sink.py
      - truffles-api/app/policy_core_v3_shadow/legacy_projector.py
      - truffles-api/app/policy_core_v3_shadow/__init__.py
      - truffles-api/tests/policy_core_v3_shadow/test_jsonl_sink.py
      - truffles-api/tests/policy_core_v3_shadow/test_legacy_projector.py
      - docs/DECISION_LEDGER.yaml
    proof_artifacts:
      - SPECS/SHADOW_RUN_V3.md (B.1 spec; this entry extends Public surface §3 with JsonlArtifactSink and project_legacy_decision)
      - pytest result: 105 passed in 0.66s across tests/policy_core_v3_shadow/, tests/policy_core_v3/, tests/pack_v1/
      - test_jsonl_sink.test_concurrent_emit_writes_serialized_lines confirms 50 concurrent emit calls produce 50 distinct, valid JSONL lines
      - test_legacy_projector covers minimal, rich, enum-intent, alternative attribute names, missing intent fallback, negative/non-numeric latency, extras isolation
    validation:
      - python3 -m py_compile passed for all 5 changed/new files.
      - pytest reported 105 passed (6 new jsonl_sink tests, 8 new legacy_projector tests).
      - JsonlArtifactSink satisfies the ArtifactSink Protocol (test_satisfies_artifact_sink_protocol).
      - test_independence.py still asserts no app.services / app.core / app.adapters imports in policy_core_v3_shadow.
      - decision_ledger_guard, tool_inventory_guard, single_semantic_owner_guard returned OK.
      - No file under truffles-api/app/services/, truffles-api/app/core/, or truffles-api/app/main.py was modified.
    known_limits:
      - SCRIPTED_TECHNICAL_PROOF only. JsonlArtifactSink has not been exercised against a real consultant_runtime hook or under multi-process concurrency (single-process asyncio lock is sufficient for current scope).
      - The legacy projector has not yet been called against a real legacy IntentResponse instance; the alternative attribute names cover the documented variants but Phase B.2.b must verify the actual mapping with a focused integration test.
      - There is no log rotation; Phase B.2.b must define artifact directory and rotation policy in a separate Decision Ledger entry.
      - The projector returns "unknown" for missing intent; downstream divergence may flag intent_mismatch rather than handle this as a separate degrade kind. Acceptable for B.2.a; revisit if mass "unknown" projections appear in B.3 corpus.
    do_not_repeat:
      - Do not import legacy modules into legacy_projector or jsonl_sink. The projector is duck-typed by design.
      - Do not add scenario-specific attribute names to the projector's search lists; additions require a Decision Ledger entry.
      - Do not let JsonlArtifactSink raise into the runner caller; the runner already swallows sink errors but the sink must not be the source of unbounded I/O.
      - Do not switch to a multi-process or multi-host sink in this layer; that belongs to a later phase with a proper queue/transport contract.
      - Do not synchronously block the event loop with file writes; use asyncio.to_thread or replace with an async file lib in a separate decision.
    next_allowed_action: >
      Phase B.2.b: in a separate session, add the consultant_runtime hook
      gated by settings.policy_core_v3_enabled. The hook (a) builds a
      LegacyTurnContext from real runtime data, (b) projects the legacy
      IntentResponse via project_legacy_decision into a LegacySummary,
      (c) constructs a SyncToAsyncLLMAdapter wrapping the existing
      LLMProvider, (d) calls run_shadow fire-and-forget with a
      JsonlArtifactSink under a configured artifact directory. In parallel,
      convert truffles-api/app/knowledge/demo_salon/SALON_TRUTH.yaml content
      into packs/beauty_salon_v1/pack.yaml so shadow-run produces
      product-relevant comparison evidence.

