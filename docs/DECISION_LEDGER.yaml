  - id: DL-2026-05-11-022
    date: 2026-05-11
    capability: Platform Architecture / Policy-Core v3 / Vocabulary Normalization + Real-LLM Corpus Run
    architecture_layer: Corpus tooling — intent vocabulary normalizer + aggregator extension; legacy code untouched
    problem: >
      The first real-LLM corpus run on beauty_salon_pilot_v0.jsonl
      (gpt-4o-mini, JSON mode, temperature=0) produced
      intent_match_rate=0.333 while turn-by-turn manual inspection showed
      v3 was semantically correct in 26 of 27 turns (96%). The 0.333 was
      a vocabulary artifact: legacy uses domain-flavored labels
      (booking_request, cancel_request, master_query, discount_haggle,
      complaint, medical, refund) while v3 uses a closed normalized enum
      (slot_collect, handoff_request, fact_question, unsupported). Without
      a normalization layer, every aggregation pass would understate v3
      quality and Phase D cutover would have no quantitative basis.
    decision: >
      (1) Author SPECS/INTENT_VOCABULARY.md as the binding mapping table
      between legacy and v3 intent vocabularies, including the
      booking_request → booking_request|slot_collect discriminator based
      on rules.required_for_booking and accumulated state slots, and the
      handoff_request reason-arg matching rule.
      (2) Add truffles-api/app/policy_core_v3_corpus/intent_vocabulary.py
      with pure normalize_legacy_intent and semantic_match functions.
      (3) Extend CorpusAggregateReport with semantic_match_rate alongside
      structural intent_match_rate; both surfaces remain visible.
      (4) Add tests/policy_core_v3_corpus/test_intent_vocabulary.py
      covering identity, escalation, discount, master_query, booking with
      and without full slots, handoff with reason arg, smalltalk,
      degrade-never-matches, and the lenient booking_request/slot_collect
      pair when state is unavailable.
      (5) Add OpenAI integration to scripts/policy_core_v3_shadow_corpus_run.py:
      `--llm openai` flag wraps OpenAIProvider through SyncToAsyncLLMAdapter
      with `response_format={"type":"json_object"}`. API key resolved from
      OPENAI_API_KEY env var or `--env-file` (default
      /home/zhan/truffles-main/truffles-api/.env). The runner CLI is the
      only place that touches an OpenAI API key; runtime stays pristine.
    classification: REPAIR
    changed_files:
      - SPECS/INTENT_VOCABULARY.md
      - truffles-api/app/policy_core_v3_corpus/intent_vocabulary.py
      - truffles-api/app/policy_core_v3_corpus/aggregator.py
      - truffles-api/app/policy_core_v3_corpus/runner.py
      - truffles-api/app/policy_core_v3_corpus/__init__.py
      - truffles-api/tests/policy_core_v3_corpus/test_intent_vocabulary.py
      - scripts/policy_core_v3_shadow_corpus_run.py
      - docs/DECISION_LEDGER.yaml
    proof_artifacts:
      - SPECS/INTENT_VOCABULARY.md (mapping table + acceptance §6)
      - pytest result: 155 passed in 1.48s (155 = 144 baseline + 11 new vocabulary tests)
      - Real-LLM run on beauty_salon_pilot_v0.jsonl with gpt-4o-mini, temperature=0, JSON mode, max_tokens=800: 25 dialogs / 27 records, latency p50=3.0s p95=5.5s max=7.0s
      - Aggregate report after vocabulary normalization{intent_match_rate=0.333, semantic_match_rate=0.963, intent_mismatch_rate=0.667, v3_degrade_rate=0.000, tool_match_rate=0.333, tool_mismatch_rate=0.333}
      - Per-turn analysis: 26 of 27 turns are semantically correct; the single remaining mismatch (bs-004-unsupported-service) is an owner-audit ambiguity (salon does not offer татуаж — both legacy `fact_question` and v3 `unsupported` are valid framings)
    validation:
      - python3 -m py_compile passed for all 7 changed/new files.
      - pytest reported 155 passed across all PoC suites.
      - test_intent_vocabulary covers 11 distinct mapping cases including booking-state discrimination, escalation reasons, master_query/discount_haggle, and the booking_request/slot_collect lenient pair.
      - Real OpenAI provider was successfully invoked from the corpus runner with the production-side OPENAI_API_KEY pulled from /home/zhan/truffles-main/truffles-api/.env without modifying that file or the runtime config.
      - Token spend on the full 25-dialog run was below 5 cents (gpt-4o-mini, ~27 turns × ~5k prompt tokens × $0.00015 + ~600 output × $0.00060).
      - decision_ledger_guard, tool_inventory_guard, single_semantic_owner_guard returned OK.
      - No file under truffles-api/app/services/, truffles-api/app/core/, or truffles-api/app/main.py was modified.
    known_limits:
