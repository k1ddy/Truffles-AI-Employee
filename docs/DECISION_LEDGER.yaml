  - id: DL-2026-05-05-010
    date: 2026-05-05
    capability: BSV1 Runtime Governance / Knowledge Data Plane / Quality Governance
    architecture_layer: Consultant Runtime + Knowledge/Data + Capabilities + Proof Governance
    problem: >
      Earlier explanations separated the one-message decision path from the
      customer-data ownership path. That made the runtime flow understandable
      but left a repeatable process gap: a turn can look correct while the
      policy-core context, pack facts, branch capabilities, operational DB
      catalog, or RAG projection are inconsistent or treated as stronger truth
      than they are. This risks more scenario-driven repairs and hidden
      split-brain between customer-facing facts and executable business actions.
    decision: >
      Every meaningful runtime investigation, LLM diagnostic, and mechanism
      repair must audit two paths together: the decision path and the data
      ownership path. The decision path is input -> policy-core owner output ->
      planner/binding -> boundary verdict -> state write/load -> executor/tool
      action -> final response -> trace/meta -> rescue flag. The data ownership
      path is Packs / Knowledge -> Capabilities -> Operational DB -> RAG /
      Qdrant projection -> Policy-core context. A Customer Data Contract must
      identify which surface owns each business datum before a repair changes
      runtime behavior. RAG/Qdrant is retrieval projection only and must not
      become semantic owner or core booking truth.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
      - docs/SESSION_START_PROMPT.txt
      - TECH.md
      - STRUCTURE.md
      - scripts/decision_ledger_guard.py
      - scripts/product_work_map_guard.py
      - truffles-api/tests/architecture/test_decision_ledger_guard.py
    proof_artifacts:
      - /tmp/truffles_customer_data_truth_20260505.json
      - /tmp/truffles_data_ownership_snapshot_20260505.json
    validation:
      - live baseline showed HEAD and runtime git_commit 9db031ee967999545f8a9673e7e57cf4d7202e73, /admin/version reachable, and /health status ok
      - go_live_data_truth returned valid=true for demo_salon/main with minimum data contract ready, 15 active services, 5 active specialists, and 15 active specialist-service links
      - data ownership snapshot classified Packs / Knowledge as knowledge_active_version, Capabilities as client_capabilities, Operational DB as Postgres services/specialists/specialist_services/appointments, RAG / Qdrant as projection only, and Policy-core context as governed projection
    known_limits:
      - The snapshot proves data exists and ownership surfaces are identifiable; it does not prove owner-approved complete production data.
      - Pack services and DB services are not identical surfaces: pack currently has 14 customer-facing service catalog rows while the operational DB has 15 active bookable service rows.
      - This decision is process/data-governance proof, not a runtime semantic repair and not Pack v0 Acceptance.
    do_not_repeat:
      - Do not explain or test a turn using only the control-flow path; always include the customer-data ownership path when business behavior is at stake.
      - Do not let RAG/Qdrant, pack fallback YAML, service aliases, regex, or operational DB rows silently become semantic owner.
      - Do not repair unsupported-service, fact-interruption, or booking continuity before identifying the owner of each datum used by the turn.
      - Do not claim data missing when go_live_data_truth or live DB proves target data exists; distinguish data existence from owner-approved production completeness.
    next_allowed_action: >
      Before FAM-C2/FAM-C3 runtime repair, define the Customer Data Contract for
      Beauty Salon v1 fields and require single-turn audit artifacts to show
      both decision path and data ownership path. Then repair shared mechanisms
      only against classified capability/layer failures.

