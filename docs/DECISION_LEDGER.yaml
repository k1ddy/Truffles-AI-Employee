  - id: DL-2026-05-03-002
    date: 2026-05-03
    capability: BSV1-04 Booking intake / BSV1-05 Booking commit / BSV1-06 Handoff / Quality Governance
    architecture_layer: Quality Evidence + Consultant Runtime Governance
    problem: >
      The project has no raw production salon messy-dialog corpus yet, and
      strict fail-first LLM runs would push the team back into row-by-row repair
      before the full failure landscape is known. That process recreates local
      fixes and hides whether failures belong to policy-core ownership,
      boundary validation, state projection, executor/tooling, data contracts,
      or acceptance oracles.
    decision: >
      Use an Internal Pilot Proof path. Generate candidate messy salon dialogs
      with existing registered scenario and llm-quality tools, let the owner
      select/edit the sample, and treat the approved set as an owner-reviewed
      synthetic messy corpus: a pilot proxy, not raw production transcripts.
      Run an Exploration lane first where behavioral failures do not stop run
      execution; only invalid-run evidence problems stop the run. Group all
      failures into a failure-family map with capability, architecture layer,
      raw owner output, boundary verdict, state, executor/tool action, final
      response, rescue flag, and proof gap before choosing repairs. Run strict
      Acceptance only after family-level repairs are designed and implemented.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
