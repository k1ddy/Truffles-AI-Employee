      - pytest result: 91 passed in 0.58s across tests/policy_core_v3_shadow/ tests/policy_core_v3/ tests/pack_v1/
      - Dry-run output: scripts/policy_core_v3_shadow_dryrun.py prints a typed ComparisonRecord including legacy_summary and divergence sections
