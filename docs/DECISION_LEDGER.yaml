version: 1
status: CANON
owner: Top Architect
purpose: >
  Concise fixed history for decisions and actions that changed Truffles product
  truth, architecture direction, blocker status, proof status, or reusable
  tooling.
memory_model:
  canon: current product/system truth
  ledger: why canon truth changed
  artifacts: raw dated evidence
  inventory: registered tools/modules/scripts
  session_prompt: zero-memory agent boot protocol
entry_required_for:
  - mechanism_change
  - architecture_decision
  - blocker_open_close_reclassify
  - tool_or_script_creation_change
  - product_status_change
  - proof_downgrade_or_invalidation
entry_not_required_for:
  - command_execution
  - micro_step
  - unchanged_validation_rerun
  - local_exploration_without_decision
schema:
  required_fields:
    - id
    - date
    - capability
    - architecture_layer
    - problem
    - decision
    - classification
    - changed_files
    - proof_artifacts
    - validation
    - known_limits
    - do_not_repeat
    - next_allowed_action
entries:
  - id: DL-2026-05-03-001
    date: 2026-05-03
    capability: BSV1-04 Booking intake / BSV1-05 Exact booking commit / Process Governance
    architecture_layer: Consultant Runtime + Booking/Calendar + Process Governance
    problem: >
      The 2026-05-03 16-row booking matrix was labelled as realistic product
      closure even though the corpus was still scripted by Truffles tooling and
      not an owner-approved messy real salon dialog pack. This made a synthetic
      proof look stronger than the evidence supports.
    decision: >
      Downgrade Realistic Booking Matrix Closure from product PROVEN to
      SCRIPTED_TECHNICAL_PROOF. Keep its live runtime, appointment, Console
      visibility, and provider-separation artifacts as useful technical evidence,
      but reserve REAL_WORLD_PRODUCT_PROOF for a Real-World Salon Acceptance Pack
      with owner-approved messy dialogs and exact DB/Console/audit/trace proof.
    classification: REPAIR
    changed_files:
