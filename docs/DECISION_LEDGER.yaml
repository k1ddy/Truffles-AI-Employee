  - id: DL-2026-05-12-024
    date: 2026-05-12
    capability: Platform Strategy / Primary Pain Lock / Cordon-And-Rebuild
    architecture_layer: >
      Cross-cutting strategy. Locks primary product pain, operational
      definition of "works", architectural laws (restated from AGENTS
      sections 8 and 10 for visibility, not as new laws), and phase
      order. Classifies legacy hot-path as STRANGLE and v3-stack as
      KEEP per AGENTS section 7.
    problem: >
      Prior sessions accumulated multiple competing product framings
      (FACT/COLLECT/HANDOFF spine, internal pilot proof, console
      readiness, observability proof, booking matrix, shadow drain,
      etc.). None of them was a single locked statement of the primary
      pain the platform must close first. Without that lock, every new
      session re-derived priorities from stale docs, agents drifted
      into scenario-by-scenario fixes, and the legacy hot path
      (intent_service.py ~15k LOC, consultant_runtime.py ~2.1k LOC,
      4x policy_timeout_*_boundary_service.py, 7x
      pack_runtime_*_adapter.py) kept absorbing new branches in
      violation of AGENTS section 10. The v3 stack
      (policy_core_v3, pack_v1, policy_core_v3_shadow,
      policy_core_v3_corpus) was built as PoC but had no strategic
      classification anchoring its role.
    decision: >
      Lock the following statements as canonical until a future ledger
      entry supersedes them. These statements are recorded in full in
      docs/PRODUCT_SYSTEM_CANON.md section 9.29 and referenced from
      docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md section 13 and
      STRATEGY/TECH_ROADMAP.md section 11. AGENTS.md is NOT modified
      because sections 2, 8, and 10 already encode the architectural
      laws stated below; restating them in AGENTS would violate
      AGENTS section 12 ("Do not create duplicate docs").

      Primary pain (single, locked): the platform must not lose any
      incoming lead 24/7 — it must answer, qualify, drive to booked
      appointment, and hand off to the owner/admin where needed.
      Includes both new leads and repeat contacts from existing
      clients.

      Target operating mode: autonomous is the final goal. Stages on
      the way to autonomous (shadow, assist) are leashed-only modes
      gated by measurable thresholds.

      First channel: WhatsApp, with mock provider used until
      commercial access is restored. The commercial WhatsApp blocker
      does not block development or integration testing.

      Operational definition of "works" (acceptance gates, all
      required):
      1. Latency gate: p95 reply time TBD-after-first-batch; final
         threshold defended as "not worse than live admin".
      2. Capture gate: % of incoming leads driven to confirmed
         appointment OR explicit qualified refusal/handoff,
         TBD-after-first-batch; measured against current manual owner,
         not absolute target.
      3. Architecture gate: 0 violations of single_semantic_owner,
         tool_inventory, decision_ledger,
         pack_is_single_source_of_truth, layer_isolation guards in
         main.
      4. Owner self-service gate: owner can update price/service/
         specialist/working-hours through Pack. Mechanism (Console GUI
         vs YAML) fixed AFTER audit of truffles-api/app/pack_v1/* and
         console-web/* surfaces.
      5. Corpus gate: every intent enabled in autonomous-mode has a
         gold-set of dialogs with owner_approved=true on which 100%
         of production reactions match expected. Hard gate for
         autonomous. Soft guideline (warn, do not block) for assist.

      Architectural contract (restated from AGENTS 8 / 10, not new):
      - LLM policy-core is the only semantic owner.
      - Pack is the only source of business knowledge.
      - Canonical hot path = 6 nodes (Ingress -> policy-core ->
        planner -> boundary -> state -> executor/render ->
        outbox/provider). Pack/RAG/Capabilities and Console/Ops are
        SUPPORT planes, not pipeline nodes.
      - Layer isolation: Boundary does not invent meaning, Executor
        does not invent intent, State does not recover semantics.
      - Corpus discipline (gate 5 above).
      - Decision Ledger discipline: every nontrivial architectural
        change is recorded here.

      Strategy: Cordon-and-rebuild.
      - Legacy hot path (intent_service.py, consultant_runtime.py,
        4x policy_timeout_*_boundary_service.py, 7x
        pack_runtime_*_adapter.py, related legacy semantics) is
        classified STRANGLE (AGENTS section 7). No new behavior may
        be added to these files. Only deletion or projection.
      - v3 stack (truffles-api/app/policy_core_v3,
        truffles-api/app/pack_v1, truffles-api/app/policy_core_v3_shadow,
        truffles-api/app/policy_core_v3_shadow_hook,
        truffles-api/app/policy_core_v3_corpus) is classified KEEP.
        All new features and the lead-24/7 path are built on v3 only.
      - Removal of legacy = one PR after all acceptance gates pass.

      Phase order (records the only valid sequence of next work):
      A. Corpus: build 30-50 realistic owner-approved messy dialogs
         (per DL-2026-05-11-023), replace DRAFT
         beauty_salon_pilot_v0.jsonl, rerun real-LLM aggregation,
         carve gold subset.
      B. v3 stack to production (no legacy edits): Boundary v2
         (single service replacing 4 timeout boundary services),
         Pack Runtime v1 (single adapter replacing 7 pack runtime
         adapters), Executor v1, WhatsApp channel via Pack
         (mock-provider until commercial restored), observability v1
         per-turn JSONL.
      C. Lead-24/7 product on v3: Mira Pack playbook, run in shadow
         then assist then autonomous per intent, each transition
         gated by corpus gate 5.
      D. Repo hygiene (background, non-blocking): STRUCTURE.md
         <= 300 lines, dead governance/legacy docs moved to
         docs/archive/, FROZEN marker on STRANGLE files, legacy
         deletion PR after gates pass.

      Order constraint: A blocks everything (gates 1, 2, 5 are
      unmeasurable without A). B and D run in parallel after A1.
      C only after A1-A3 and the minimum B subset (Boundary v2 +
      Pack Runtime v1 + WhatsApp ingress).

      Explicit non-goals (also recorded in PRODUCT_SYSTEM_CANON
      section 9.29):
      - Not upsell, reactivation, revenue analytics — LATER.
      - Not multi-channel at start — only WhatsApp.
      - Not Google Calendar as primary booking source — LATER.
      - Not investor demo as priority driver.
      - Not Chatflow repair while commercially blocked — BLOCKED.
      - Not "replace the administrator entirely" as a goal; handoff
        to a human is a normal outcome of a dialog, not a failure.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
      - STRATEGY/TECH_ROADMAP.md
    proof_artifacts:
      - This entry.
      - "PRODUCT_SYSTEM_CANON.md section 9.29 (Primary Pain Lock + Cordon-And-Rebuild Strategy)."
      - "BEAUTY_SALON_V1_CAPABILITY_MAP.md section 13 (Lead-24/7 Acceptance Gate)."
      - "STRATEGY/TECH_ROADMAP.md section 11 (Lead-24/7 phase plan: Cordon-and-Rebuild)."
    validation:
      - decision_ledger_guard expected OK after entry.
      - No code or test files modified by this entry.
      - AGENTS.md intentionally not modified (per AGENTS section 12).
    known_limits:
      - Latency and capture thresholds remain TBD-after-first-batch.
        They cannot be set responsibly before the realistic corpus
        from DL-023 exists.
      - Owner self-service mechanism remains pending audit of pack_v1
        and console-web surfaces. The gate is locked; the mechanism
        is not.
