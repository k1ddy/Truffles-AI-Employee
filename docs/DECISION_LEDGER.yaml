  - id: DL-2026-05-03-003
    date: 2026-05-03
    capability: Quality Governance / BSV1-12 Observability / BSV1-04 Booking diagnostics
    architecture_layer: Quality Tooling + Provider Boundary + Evidence Classification
    problem: >
      The first Real-World Salon Pack runtime attempts proved the existing
      quality runner had a tool/process gap: `--skip-outbox` removed internal
      final-response evidence, while delivery-coupled runs produced transport
      false failures while Chatflow/WhatsApp is commercially unavailable. That
      made semantic exploration depend on provider delivery and risked treating
      invalid runs as product evidence.
    decision: >
      Split transport evidence policy in `ops/diagnose.py`. Dev Exploration may
      use rendered assistant evidence recovered from inline response or the
      `messages` table; strict Acceptance remains locked to delivery evidence.
      Mark invalid attempts as do-not-use artifacts, record Tranche A only as a
      diagnostic failure-family map, and keep product proof blocked until full
      acceptance has raw owner green, final runtime green, rescue=no, and exact
      DB/Console/audit/trace proof.
    classification: REPAIR
    changed_files:
      - docs/DECISION_LEDGER.yaml
      - docs/PRODUCT_SYSTEM_CANON.md
      - docs/BEAUTY_SALON_V1_CAPABILITY_MAP.md
      - docs/SESSION_START_PROMPT.txt
