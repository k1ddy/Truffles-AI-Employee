meta:
  date_recorded: "2025-12-23"
  recorded_by: "Codex"
  source: "CEO decisions + Phase 0 release criteria"

decisions:
  - id: "DEC-001"
    area: "tenancy"
    choice: "A"
    statement: "Shared multi-tenant; tenant_id everywhere"
  - id: "DEC-002"
    area: "webhook_security"
    choice: "REQUIRE_SECRET"
    statement: "Webhook requires per-tenant secret (enforced for /webhook and /webhook/{client_slug})"
  - id: "DEC-003"
    area: "autonomy"
    choice: "B"
    statement: "Low-risk writes auto; high-risk requires verify"
  - id: "DEC-004"
    area: "release_model"
    choice: "A"
    statement: "Canary by tenant"
  - id: "DEC-005"
    area: "kb_storage"
    choice: "B"
    statement: "Postgres stores KB versions/sources; Qdrant is index-only"
  - id: "DEC-006"
    area: "gcp"
    choice: "A"
    statement: "Freeze GCP; focus on prod Docker on office server"
  - id: "DEC-007"
    area: "phase_0_release"
    choice: "A"
    statement: "Phase 0 release requires LAW gate + truth-first + ACK-first/outbox + coalescing + EVAL green + prod smoke-check"
  - id: "DEC-008"
    area: "escalation_ui"
    choice: "A"
    statement: "Telegram = manager UI adapter; roles/identities in DB; one Telegram group per branch; learning uses queued candidates with owner auto-approve"
  - id: "DEC-009"
    area: "branch_routing"
    choice: "CONFIGURABLE"
    statement: "Branch resolution is configurable: by_instance/ask_user/hybrid; branch required for pricing; admins may auto-approve only within their branch when enabled"
  - id: "DEC-010"
    area: "decision_model"
    choice: "LLM_FIRST_UNDERSTANDING"
    statement: "LLM-first understanding (intent/slots/summary) with deterministic commit; facts only via tools/packs; response guard required; Hard-LAW/policy/state remain deterministic; no local LLM"
  - id: "DEC-011"
    area: "org_level_tenancy"
    choice: "COMPANY_CLIENT_BRANCH"
    statement: "Company -> Client -> Branch hierarchy with explicit memberships/roles; console supports client/branch selection; all API/events require tenant_context (company_id/client_id/branch_id)."
  - id: "DEC-012"
    area: "observability"
    choice: "OTEL_TEMPO"
    statement: "Adopt OTel spans in API/outbox/sentinel with correlation attrs; persist stage timing in decision_meta.timing.stages and outbox.meta; trace-bundle includes timing; Tempo is trace store."
  - id: "DEC-013"
    area: "calendar_scheduling"
    choice: "SOT_POSTGRES_BRANCH_CALENDAR"
    statement: "Appointments SoT lives in Postgres; external calendars are projection + busy sources only; confirmation policy is mixed per-branch; calendar scope is per-branch; bot/console/telegram use one scheduling service; provider sync via outbox; OAuth tokens encrypted with pgcrypto (KMS upgradeable)."
  - id: "DEC-014"
    area: "production_go_no_go"
    choice: "CONTROL_PLANE_READY"
    statement: "Live customers allowed only after Control Plane Go/No-Go checklist is satisfied and evidence recorded in STATE.md (CI green + deploy, console build info, provisioning wizard, onboarding gates, knowledge publish safety, trace/meta/outbox live-check)."
  - id: "DEC-014"
    area: "knowledge_studio"
    choice: "DB_REGISTRY_PACK_EXPORT"
    statement: "Knowledge source of truth is a structured DB registry with versioning; publish generates pack YAML, validates via existing pack rules, stores artifacts with audit, syncs Qdrant from published version only, and supports rollback + safe-mode on invalid/failed publish."
  - id: "DEC-015"
    area: "capabilities_model"
    choice: "SEPARATE_TABLE_JSONB_SCHEMA"
    statement: "Client capabilities live in a dedicated table with JSONB payload + schema_version; scope supports client-level defaults and branch-level overrides; effective capabilities are merged at read time, not stored in client_settings."
