  - intent
  - outcome
  - tool_action
  - interaction_owner
required_text_markers:
  - path: truffles-api/app/core/turn_planner.py
    pattern: "def build_controlled_degrade_signal("
  - path: truffles-api/app/core/turn_planner.py
    pattern: "def build_preflight_reject_signal("
