    pattern: "if isinstance(plan_result.boundary_signal, PlannerBoundarySignal):"
  - path: truffles-api/app/core/consultant_runtime.py
    pattern: "\"planner_boundary_signal\": True,"
  - path: truffles-api/app/core/consultant_runtime.py
    pattern: "\"control_action\": \"session_reset\","
