guard_name: semantic_owner_reopen_guard
planner_file: truffles-api/app/core/turn_planner.py
runtime_file: truffles-api/app/core/consultant_runtime.py
dialog_state_file: truffles-api/app/core/dialog_state_service.py
executor_file: truffles-api/app/core/turn_executor.py
removed_planner_builders:
  - build_controlled_degrade
  - build_preflight_reject
planner_signal_builders:
  - build_controlled_degrade_signal
  - build_preflight_reject_signal
