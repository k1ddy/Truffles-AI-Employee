version: 2026-03-31.v1
hotspots:
  - path: truffles-api/app/services/pack_runtime_service.py
    active_waiver: null
    forbidden_import_modules:
      - app.services.pack_runtime_default
    forbidden_function_defs:
      - get_pack_adapter
    tracked_function_names:
      name_patterns:
        - '^build_runtime_service_.*$'
        - '^get_pack_decision$'
        - '^get_pack_price_item$'
        - '^get_pack_price_reply$'
        - '^get_pack_service_decision$'
        - '^get_pack_service_hint$'
      exact_allowlist:
        - build_runtime_service_duration_reply
        - build_runtime_service_not_found_reply
        - build_runtime_service_presence_reply_for_name
        - build_runtime_service_truth_reply
        - get_pack_decision
        - get_pack_price_item
        - get_pack_price_reply
        - get_pack_service_decision
        - get_pack_service_hint
  - path: truffles-api/app/services/tool_registry_service.py
    active_waiver: null
    forbidden_import_names:
      - get_pack_adapter
    forbidden_call_names:
      - get_pack_adapter
      - _call_pack_adapter
      - _find_best_price_item
      - _format_price_reply
      - _format_service_duration_reply
      - _format_service_not_found_reply
      - _format_service_presence_reply_for_name
      - _format_service_reply
repo_callsite_contracts:
  - search_roots:
      - truffles-api/app
    call_names:
      - get_pack_adapter
      - _call_pack_adapter
    exact_allowlist: []
