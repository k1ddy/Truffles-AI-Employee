        - _build_runtime_semantic_contract
        - _build_semantic_referents
        - _build_semantic_state
        - _canonical_decision_pending_question_contract
        - _canonical_decision_semantic_contract
        - _canonical_decision_semantic_frame
        - _decision_pending_question_contract
        - _decision_semantic_contract
        - _derive_dialog_state_from_projection
        - _execution_semantic_enrichment_from_contract
        - _execution_semantic_payload
        - _normalize_semantic_entity_refs
