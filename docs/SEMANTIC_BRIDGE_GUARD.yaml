version: 2026-03-30.v1
hotspots:
  - path: truffles-api/app/services/intent_service.py
    active_waiver: null
    tracked_function_names:
      name_patterns:
        - '^route_llm_policy_core$'
      exact_allowlist:
        - route_llm_policy_core
  - path: truffles-api/app/core/turn_planner.py
    active_waiver: null
    tracked_function_names:
      name_patterns:
        - '^build_from_semantic_decision$'
        - '^canonical_.*$'
        - '^detect_.*semantic.*$'
        - '^_.*semantic.*$'
        - '^_.*pending_question.*$'
      exact_allowlist:
        - _build_pending_question_contract
        - _build_semantic_contract_payload
        - _build_semantic_frame_payload
        - _coerce_semantic_decision
        - _normalized_semantic_payload
        - _strip_pending_question_payload_if_handoff
        - build_from_semantic_decision
        - canonical_pending_question_contract
        - canonical_semantic_contract
        - canonical_semantic_frame
        - detect_missing_semantic_owner
        - detect_semantic_mutation
