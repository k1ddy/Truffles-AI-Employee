        - _has_canonical_semantic_owner
        - _merge_pack_grounding_semantic_contract
        - _normalize_semantic_entity_refs
        - _normalize_semantic_referents
        - _pack_semantic_grounding
        - _resolve_policy_info_refs
        - _semantic_entity_ref_key
        - _semantic_referents
  - path: truffles-api/app/core/consultant_runtime.py
    active_waiver: null
    tracked_function_names:
      name_patterns:
        - '^_build_policy_core_memory_profile$'
        - '^_.*semantic.*$'
        - '^_.*pending_question.*$'
        - '^_record_turn_trace$'
      exact_allowlist:
        - _build_policy_core_memory_profile
        - _execution_semantic_enrichment
        - _has_canonical_semantic_owner
        - _merge_semantic_enrichment
        - _project_runtime_pending_question_contract
        - _project_runtime_semantic_contract
        - _project_runtime_semantic_frame
        - _record_turn_trace
        - _semantic_contract_enrichment
