gaps:
  - id: "GAP-001"
    title: "ChatFlow inbound webhook auth missing"
    status: "DONE"
    why_it_matters: "Anyone who can reach /webhook can inject messages, escalate, or spam tenants."
    evidence:
      - "truffles-api/app/routers/webhook/_legacy.py (X-Webhook-Secret check)"
      - "truffles-api/app/models/client_settings.py (webhook_secret)"
      - "ops/migrations/011_add_webhook_secret.sql"
    proposed_fix_mvp: "Require webhook_secret (header or query param) per client (client_settings.webhook_secret); reject missing/invalid secrets with 401."
    acceptance_tests:
      - "POST /webhook/{client_slug} without secret returns 401"
      - "POST /webhook/{client_slug}?webhook_secret=... returns 200"
      - "POST /webhook without X-Webhook-Secret returns 401"
      - "POST /webhook with valid X-Webhook-Secret returns 200"

  - id: "GAP-002"
    title: "Canary by tenant not implemented"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "CEO decision requires tenant-scoped rollout/rollback; without it, risky changes hit all tenants."
    evidence:
      - "rg -n 'canary' truffles-api (no matches)"
    proposed_fix_mvp: "Add release_channel field in client_settings and gate new behaviors by channel (stable/canary)."
    acceptance_tests:
      - "Tenant marked canary uses new behavior; stable tenant stays unchanged"
      - "Switching tenant back to stable reverts behavior"

  - id: "GAP-003"
    title: "CI/CD workflows missing in repo"
    status: "DONE"
    why_it_matters: "No automated checks before deploy; regressions can ship silently."
    evidence:
      - ".github/workflows/ci.yml (ruff + pytest)"
    proposed_fix_mvp: "Add .github/workflows/ci.yml with ruff + pytest; fail on lint/test errors."
    acceptance_tests:
      - "PR triggers CI and runs ruff + pytest"
      - "Failing test blocks merge"

  - id: "GAP-004"
    title: "Qdrant API key mismatch in API service"
    status: "DONE"
    why_it_matters: "RAG retrieval can fail if API uses missing key while Qdrant requires API key."
    evidence:
      - "truffles-api/app/services/knowledge_service.py:11-47 (uses QDRANT_API_KEY)"
      - "truffles-api/.env (QDRANT_API_KEY present)"
      - "/home/zhan/restart_api.sh (uses --env-file .env)"
    proposed_fix_mvp: "Set QDRANT_API_KEY in truffles-api/.env and ensure API container uses --env-file."
    acceptance_tests:
      - "search_knowledge returns results with 200 from Qdrant"
      - "Missing key triggers startup error/log"

  - id: "GAP-005"
    title: "Outbound WhatsApp send has no retries/backoff"
    status: "DONE"
    why_it_matters: "Transient ChatFlow failures cause message loss and silent drops."
    evidence:
      - "truffles-api/app/services/chatflow_service.py (CHATFLOW_RETRY_ATTEMPTS/CHATFLOW_RETRY_BACKOFF_SECONDS)"
    proposed_fix_mvp: "Retry with exponential backoff and log final failure."
    acceptance_tests:
      - "Simulated 500 from ChatFlow triggers retries"
      - "Success on retry marks delivery success"

  - id: "GAP-006"
    title: "Quality check (QC) stage missing"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "No safety/quality gate for LLM outputs; higher risk of harmful or off-brand responses."
    evidence:
      - "rg -n 'quality_check|quality check|qc' truffles-api/app (no matches)"
    proposed_fix_mvp: "Add QC function (rules or LLM) to block unsafe outputs and trigger human fallback."
    acceptance_tests:
      - "Unsafe response triggers QC block"
      - "Safe response passes QC"

  - id: "GAP-007"
    title: "Alerting not configured in runtime env"
    status: "DONE"
    why_it_matters: "Critical failures (ChatFlow/Qdrant/LLM) do not reach operators."
    evidence:
      - "truffles-api/app/services/alert_service.py:11-38 (requires ALERT_BOT_TOKEN/ALERT_CHAT_ID)"
      - "truffles-api/app/routers/alerts.py (/alerts/test)"
      - "truffles-api/.env (ALERT_BOT_TOKEN/ALERT_CHAT_ID present)"
      - "/home/zhan/restart_api.sh (uses --env-file .env)"
    proposed_fix_mvp: "Set ALERT_BOT_TOKEN/ALERT_CHAT_ID in truffles-api/.env and keep /alerts/test for runtime checks."
    acceptance_tests:
      - "Trigger alert sends Telegram message"
      - "Missing env causes loud startup warning"

  - id: "GAP-008"
    title: "Audit log table exists but is not wired"
    status: "UNKNOWN"
    why_it_matters: "No trusted trail for manager actions, escalations, or config changes."
    evidence:
      - "docker exec truffles_postgres_1 psql -U $DB_USER -d chatbot -c \\dt+ (audit_log table) (2025-12-21)"
      - "rg -n 'audit_log' truffles-api/app (no matches)"
    proposed_fix_mvp: "Add audit logger in API for handover lifecycle + manager actions."
    acceptance_tests:
      - "Creating/resolving handover writes audit_log row"
      - "Audit entries include actor and tenant_id"

  - id: "GAP-009"
    title: "Incident/error log pipeline not wired"
    status: "UNKNOWN"
    why_it_matters: "Errors are not persisted for analysis and RCA."
    evidence:
      - "docker exec truffles_postgres_1 psql -U $DB_USER -d chatbot -c \\dt+ (error_logs, message_traces tables) (2025-12-21)"
      - "rg -n 'error_logs|message_traces' truffles-api/app (no matches)"
    proposed_fix_mvp: "Write structured errors to error_logs and per-message traces to message_traces."
    acceptance_tests:
      - "Forced error creates error_logs row"
      - "Message processing writes trace entry"

  - id: "GAP-010"
    title: "Webhook processing is synchronous (no ack-first queue)"
    status: "DONE"
    why_it_matters: "Slow LLM/ChatFlow calls can cause webhook timeouts and duplicate deliveries."
    evidence:
      - "truffles-api/app/routers/webhook/_legacy.py (enqueue_only=True for /webhook and /webhook/{client_slug})"
      - "truffles-api/app/services/outbox_service.py (enqueue/claim/mark)"
      - "truffles-api/app/routers/admin.py (/admin/outbox/process)"
    proposed_fix_mvp: "Write inbound message to outbox and return 200 immediately; process via outbox worker."
    acceptance_tests:
      - "Webhook responds <200ms while processing continues async"
      - "Outbox worker delivers response and updates message status"

  - id: "GAP-011"
    title: "Idempotency is inbound-only"
    status: "PARTIAL"
    why_it_matters: "Duplicate outbound sends can occur on retries or multi-callbacks."
    evidence:
      - "truffles-api/app/routers/webhook/_legacy.py:185-240 (inbound dedup)"
      - "truffles-api/app/routers/webhook/_legacy.py (outbound_idempotency_key via msg_id)"
      - "truffles-api/app/services/chatflow_service.py (msg_id passthrough)"
    proposed_fix_mvp: "Extend outbound idempotency key to all send paths (not only webhook/outbox)."
    acceptance_tests:
      - "Repeated outbound send with same key results in single ChatFlow request"

  - id: "GAP-012"
    title: "Release rollback strategy not documented"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "No defined rollback path when production changes break tenants."
    evidence:
      - "rg -n 'rollback' STRATEGY SPECS docs STATE.md TECH.md (only db.rollback in spec)"
    proposed_fix_mvp: "Document rollback steps for API + workflows; include tenant rollback via canary channel."
    acceptance_tests:
      - "Rollback doc includes API image revert + tenant channel flip"

  - id: "GAP-013"
    title: "Sentinel/continuous monitoring not implemented"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "System health regressions can go unnoticed between manual checks."
    evidence:
      - "rg -n 'sentinel' . (no matches)"
    proposed_fix_mvp: "Add lightweight sentinel (cron) that pings /health, checks Qdrant, and posts to alerts."
    acceptance_tests:
      - "Sentinel detects Qdrant down and sends alert"
      - "Sentinel passes when all checks OK"

  - id: "GAP-014"
    title: "Hard-LAW pre-LLM gate only implemented for demo_salon"
    status: "PARTIAL"
    why_it_matters: "Non-demo tenants can reach LLM before hard-LAW escalation, creating legal/financial risk."
    evidence:
      - "truffles-api/app/routers/webhook/http.py:60-85 (webhook delegates to legacy orchestrator)"
      - "truffles-api/app/routers/webhook/_legacy.py:1571-1579 (policy handlers only for demo_salon)"
      - "truffles-api/app/routers/webhook/_legacy.py:4581-4585 (policy gate runs only with policy_handler)"
      - "truffles-api/app/routers/webhook/_legacy.py:7262-7288 (LLM guard runs post-response)"
      - "STRATEGY/REQUIREMENTS.md:44 (Hard-LAW requirement)"
    proposed_fix_mvp: "Add hard-LAW gate on user input for all entrypoints before any LLM call; escalate immediately."
    acceptance_tests:
      - "Non-demo client: payment/refund/medical/complaint/reschedule message escalates before LLM (llm_used=false)"
      - "Trace/meta shows policy_gate=hard_law and action=escalate on user message"

  - id: "GAP-015"
    title: "/message endpoint bypasses LAW and policy gates"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "Clients using /message can bypass Hard-LAW and policy gates and get unsafe LLM replies."
    evidence:
      - "truffles-api/app/main.py:35 (message router enabled)"
      - "truffles-api/app/routers/message.py:96-152 (classify_intent -> generate_bot_response without LAW/policy gates)"
      - "truffles-api/app/services/intent_service.py:330 (escalation intents limited to human_request/frustration)"
      - "STRATEGY/REQUIREMENTS.md:44-45 (LAW + policy gates required)"
    proposed_fix_mvp: "Disable /message in prod or route it through the same pre-LLM LAW/policy gate as webhook."
    acceptance_tests:
      - "POST /message with Hard-LAW text triggers escalation and no LLM call"
      - "POST /message with discounts/payment info respects client_pack policy rules"

  - id: "GAP-016"
    title: "Policy gates (discounts/payment) depend on demo-only handler"
    status: "PARTIAL"
    why_it_matters: "Without a policy handler, discounts/payment topics can reach LLM without explicit policy rules."
    evidence:
      - "truffles-api/app/routers/webhook/_legacy.py:5075-5081 (discounts gate requires policy_handler)"
      - "truffles-api/app/routers/webhook/_legacy.py:1571-1579 (_POLICY_HANDLERS only demo_salon)"
      - "truffles-api/app/routers/webhook/policy.py:301-314 (policy_type fallback only for demo_salon)"
      - "STRATEGY/REQUIREMENTS.md:45 (policy gates required)"
    proposed_fix_mvp: "Load policy_pack for all clients via client config and enforce default escalation when rules missing."
    acceptance_tests:
      - "Client without discounts rules: discounts question escalates"
      - "Client with discounts rules: response uses policy text and skips LLM"

  - id: "GAP-017"
    title: "Branch isolation not enforced in RAG and escalation routing"
    status: "PARTIAL"
    why_it_matters: "Multi-branch tenants can leak knowledge across branches and route escalations to wrong managers."
    evidence:
      - "truffles-api/app/routers/webhook/_legacy.py (branch_routing trace + branch_id in decision_meta)"
      - "truffles-api/app/services/knowledge_service.py (branch filter + branch_filter_empty fallback)"
      - "truffles-api/app/services/escalation_service.py (branch telegram routing when manager_scope=branch)"
      - "truffles-api/app/models/branch.py:19-20 (branch telegram_chat_id/knowledge_tag exist)"
      - "STRATEGY/REQUIREMENTS.md:59 (tenant isolation)"
    proposed_fix_mvp: "Backfill Qdrant with branch_id/knowledge_tag and enforce strict branch filter (no fallback); keep branch‑telegram routing."
    acceptance_tests:
      - "Two branches under same client return different RAG results based on branch filter"
      - "Escalation uses Branch.telegram_chat_id when manager_scope=branch"
      - "After backfill, branch_filter_empty does not appear in trace for branch‑scoped queries"

  - id: "GAP-018"
    title: "Base-80 facts can be generated by LLM instead of pack-only lookup"
    status: "PARTIAL"
    why_it_matters: "Facts (prices, address, hours) are not pack-sourced, violating truth-only requirement."
    evidence:
      - "truffles-api/app/services/ai_service.py:1707-1913 (LLM used for final response)"
      - "truffles-api/app/routers/webhook/_legacy.py:7408-7422 (truth gate runs only after LLM failure and requires policy_handler)"
      - "truffles-api/app/routers/webhook/_legacy.py:1571-1579 (policy handlers only demo_salon)"
      - "STRATEGY/REQUIREMENTS.md:47-50 (LLM must not create facts)"
    proposed_fix_mvp: "Implement client_pack responder for Base-80 classes and skip LLM when data found."
    acceptance_tests:
      - "Pricing/location/hours/duration answered with llm_used=false and fact_source=truth"
      - "If client_pack missing data, system escalates or clarifies instead of LLM guess"

  - id: "GAP-019"
    title: "Ops docs mark critical scripts as disposable; Qdrant scripts conflict on vector size"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "Operators may delete or misuse critical scripts; wrong vector size can break production RAG."
    evidence:
      - "STRUCTURE.md:337 (ops/*.sh marked one-off)"
      - "ops/backup_postgres.sh:2-3 (daily backup)"
      - "ops/backup_qdrant.sh:2-3 (weekly backup)"
      - "ops/start_bge_m3.sh:1-7 (embedding service startup)"
      - "ops/create_collection.py:7-9 (vector size 1536)"
      - "ops/recreate_collection.py:16-22 (vector size 1024)"
    proposed_fix_mvp: "Update STRUCTURE.md to list required ops scripts and consolidate Qdrant collection creation to one size."
    acceptance_tests:
      - "STRUCTURE.md lists backup and BGE scripts under keep"
      - "Only one Qdrant collection script defines the vector size used in prod"

  - id: "GAP-020"
    title: "decision_trace missing for service_semantic path"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "Without trace, reasoning is unverifiable; violates trace-on-every-user-msg canon."
    evidence:
      - "conv_id b8c559d1-f8cd-4173-ae70-0a9683833e48, msg_id 122862cd-7e14-4cb9-8ebd-9639d5cef014 ('Делаете депиляцию?')"
      - "messages.metadata.decision_meta.intent=service_semantic; conversation.context.decision_trace has no entries near 2026-01-15T04:03:12Z"
    proposed_fix_mvp: "Write trace stage on service_semantic path (e.g., stage=service_semantic or class_router) for every user message."
    acceptance_tests:
      - "Service-semantic message produces decision_trace entry with stage=service_semantic"
      - "SQL shows trace entry exists for the same user msg timestamp"

  - id: "GAP-021"
    title: "Consult short-circuit does not override expected_reply on explicit pricing/duration + service"
    status: "PARTIAL"
    why_it_matters: "User asks price/duration with a service, but system asks to уточнить услугу due to consult_return/expected_reply; violates consult canon."
    evidence:
      - "conv_id b8c559d1-f8cd-4173-ae70-0a9683833e48, msg_id d082c330-eac7-41fa-b094-a37c2e174c35 ('Сколько стоит депиляция?')"
      - "decision_meta: intent=service_clarify, consult_return=true, expected_reply_type=service_choice (should be pricing reply)"
      - "SPECS/CONSULTANT.md (consult short-circuit rule)"
    proposed_fix_mvp: "If pricing/duration/location/hours with explicit service detected, bypass consult_return/expected_reply and route to info/booking."
    acceptance_tests:
      - "\"Сколько стоит депиляция?\" returns pricing answer with fact_source=truth and no service_clarify"
      - "\"Сколько длится депиляция?\" returns duration answer without consult_return"

  - id: "GAP-022"
    title: "Service presence query returns unrelated price list"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "Asking 'Do you do X?' must answer presence, not a different service price list; breaks trust."
    evidence:
      - "conv_id b8c559d1-f8cd-4173-ae70-0a9683833e48, msg_id 122862cd-7e14-4cb9-8ebd-9639d5cef014 ('Делаете депиляцию?')"
      - "assistant replied with pedicure prices (message id 5f87d11a-122e-468c-bafe-5fd3597b490e)"
    proposed_fix_mvp: "Use service_presence_reply when intent is service presence; do not map to unrelated price list."
    acceptance_tests:
      - "\"Делаете депиляцию?\" -> \"Да, делаем депиляцию.\" (service_presence_reply)"
      - "No unrelated price items in response"

  - id: "GAP-023"
    title: "Chaos dialog robustness testing (noise/interruptions) missing"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "Static evals do not cover typos/word order/interruptions; regressions in slot carryover and booking completion go undetected."
    evidence:
      - "truffles-api/tests/test_demo_salon_eval.py (fixed turns only; no noise injection)"
      - "rg -n 'hypothesis|fuzz|property' truffles-api/tests (no matches)"
    proposed_fix_mvp: "Add seeded chaos-eval tier: generate 10-15 turn dialogs with noise transforms (typos, word shuffle, fillers, topic interruptions) and assert booking completion + decision_meta invariants; run nightly or on EVAL/pack changes."
    acceptance_tests:
      - "EVAL_TIER=chaos runs with fixed seed and passes"
      - "Chaos suite asserts booking completion and no unexpected escalation on noisy inputs"

  - id: "GAP-024"
    title: "Long-term memory profile (consent + context) deferred"
    status: "PARTIAL"
    why_it_matters: "Personalization is planned but must be opt-in and safe; current work is a disabled skeleton."
    evidence:
      - "SPECS/CONSULTANT.md (Правило 3: отложено, flag OFF)"
      - "truffles-api/app/routers/webhook/decision.py (memory_profile skeleton, flag OFF)"
      - "truffles-api/app/routers/webhook/context_manager.py (memory helpers)"
      - "truffles-api/app/services/state_service.py (preserve memory keys on reset)"
    proposed_fix_mvp: "Enable MEMORY_PROFILE_ENABLED with consent gate, finalize contract, add tests."
    acceptance_tests:
      - "Consent prompt shown once; pending stored; yes persists memory in conversation.context"
      - "MEMORY_PROFILE_ENABLED=0 produces no memory writes"

  - id: "GAP-025"
    title: "Calendar provider sync for appointments not implemented"
    status: "NOT_IMPLEMENTED"
    why_it_matters: "confirm_slots and live availability cannot be safely enabled; external calendar drift risks double-booking."
    evidence:
      - "truffles-api/app/services/google_calendar_service.py (OAuth + direct API; no outbox sync)"
      - "truffles-api/app/routers/calendar.py (reads AppointmentSyncState only)"
      - "truffles-api/app/models/calendar_sync_cursor.py (no runtime usage)"
      - "truffles-api/app/services/booking_service.py (legacy direct Google sync)"
      - "SPECS/ARCHITECTURE.md (requires outbox-based provider sync)"
    proposed_fix_mvp: "Add outbox-based outbound sync (appointments->Google) + inbound busy->calendar_blocks; record appointment_sync_states + conflict policy; staleness gate for confirm_slots."
    acceptance_tests:
      - "Appointment create enqueues outbox event and updates appointment_sync_states with external_id"
      - "Inbound Google event creates/updates calendar_blocks only (no SoT overwrite)"
      - "Stale sync disables confirm_slots and falls back to collect_preferences"
