name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/k1ddy/truffles-ai-employee

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check app tests

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Unit tests (webhook helpers)
        run: pytest -q tests/test_webhook_*.py

  core-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (core)
        run: pytest -q tests/test_demo_salon_eval.py

  long-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (long)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=long

  asr-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (asr)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=asr

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version

      - name: Secret scan (gitleaks no-git)
        if: github.event_name == 'workflow_dispatch'
        run: |
          /tmp/gitleaks detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug

      - name: Upload gitleaks report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif

  build-push:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [lint, unit-tests, core-eval, long-eval, asr-eval, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (manual)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker rm -f truffles-api >/dev/null 2>&1 || true
            IMAGE_TAG=main
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              IMAGE_TAG=sha-${{ github.sha }}
            fi
            IMAGE_NAME=${{ env.IMAGE_NAME }}:${IMAGE_TAG} PULL_IMAGE=1 \
            REQUIRE_GHCR=1 VERIFY_VERSION=1 \
            EXPECTED_GIT_COMMIT=${{ github.sha }} EXPECTED_VERSION=${{ github.ref_name }} \
            bash ~/restart_api.sh

  ci-livecheck:
    if: vars.CI_LIVECHECK_ENABLED == '1' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_RAW="${{ secrets.SSH_PRIVATE_KEY }}"
          if printf '%s' "${KEY_RAW}" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%b' "${KEY_RAW}" | tr -d '\r' > ~/.ssh/id_rsa
          else
            printf '%s' "${KEY_RAW}" | tr -d '\r' | base64 -d > ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -yf ~/.ssh/id_rsa >/dev/null
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Livecheck safety gate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SSH="ssh -i ~/.ssh/id_rsa -p ${SERVER_PORT} -o StrictHostKeyChecking=yes ${SERVER_USER}@${SERVER_HOST}"
          $SSH "bash -s" <<'REMOTE' | tee artifacts/livecheck-gate.txt
          set -euo pipefail
          TEST_MODE=$(docker exec -i truffles-api /bin/sh -lc 'printf "%s" "${TEST_MODE:-}"')
          ALLOWLIST=$(docker exec -i truffles-api /bin/sh -lc 'printf "%s" "${OUTBOUND_ALLOWLIST_JIDS:-}"')
          LEARNING_MODE=$(docker exec -i truffles-api /bin/sh -lc 'printf "%s" "${LEARNING_MODE:-}"')
          QDRANT_COLLECTION=$(docker exec -i truffles-api /bin/sh -lc 'printf "%s" "${QDRANT_COLLECTION:-}"')
          QDRANT_COLLECTION_EFFECTIVE="${QDRANT_COLLECTION}"
          if [ -z "${QDRANT_COLLECTION_EFFECTIVE}" ]; then
            QDRANT_COLLECTION_EFFECTIVE="truffles_knowledge_ci"
          fi
          echo "TEST_MODE=${TEST_MODE}"
          echo "OUTBOUND_ALLOWLIST_JIDS=${ALLOWLIST}"
          echo "LEARNING_MODE=${LEARNING_MODE}"
          echo "QDRANT_COLLECTION=${QDRANT_COLLECTION}"
          echo "QDRANT_COLLECTION_EFFECTIVE=${QDRANT_COLLECTION_EFFECTIVE}"
          if [ "${TEST_MODE}" != "1" ]; then
            echo "TEST_MODE_NOT_ENABLED"
            exit 1
          fi
          if [ "${ALLOWLIST}" != "77015705555@s.whatsapp.net" ]; then
            echo "ALLOWLIST_MISMATCH"
            exit 1
          fi
          case "${QDRANT_COLLECTION_EFFECTIVE}" in
            *_ci) ;;
            *)
              echo "QDRANT_COLLECTION_UNSAFE"
              exit 1
              ;;
          esac
          REMOTE

      - name: Livecheck runner (CA-01/08/09/10)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SSH="ssh -i ~/.ssh/id_rsa -p ${SERVER_PORT} -o StrictHostKeyChecking=yes ${SERVER_USER}@${SERVER_HOST}"
          $SSH "bash -s" <<'REMOTE' | tee artifacts/livecheck-ca01.jsonl
          set -euo pipefail
          cd ~/truffles-main
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca01-core \
            --seed 777 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net
          REMOTE
          $SSH "bash -s" <<'REMOTE' | tee artifacts/livecheck-ca08.jsonl
          set -euo pipefail
          cd ~/truffles-main
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca08-state \
            --seed 778 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net
          REMOTE
          $SSH "bash -s" <<'REMOTE' | tee artifacts/livecheck-ca09.jsonl
          set -euo pipefail
          cd ~/truffles-main
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca09-manager \
            --seed 779 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net
          REMOTE
          $SSH "bash -s" <<'REMOTE' | tee artifacts/livecheck-ca10.jsonl
          set -euo pipefail
          cd ~/truffles-main
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca10-outbox \
            --seed 780 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net
          REMOTE

      - name: Upload livecheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecheck-artifacts
          path: artifacts
