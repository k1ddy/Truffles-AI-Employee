name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_long:
        description: "Force long-eval/asr-eval"
        type: boolean
        default: false
      run_livecheck:
        description: "Force ci-livecheck (requires deploy)"
        type: boolean
        default: false
      run_k6:
        description: "Run k6 console load smoke"
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/k1ddy/truffles-ai-employee

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.manual.outputs.l1 || steps.filter.outputs.l1 }}
      l2: ${{ steps.manual.outputs.l2 || steps.filter.outputs.l2 }}
      console_web: ${{ steps.manual.outputs.console_web || steps.filter.outputs.console_web }}
      console_contracts: ${{ steps.manual.outputs.console_contracts || steps.filter.outputs.console_contracts }}
      deploy_required: ${{ steps.manual.outputs.deploy_required || steps.filter.outputs.deploy_required }}
      livecheck_required: ${{ steps.manual.outputs.livecheck_required || steps.filter.outputs.livecheck_required }}
    steps:
      - uses: actions/checkout@v4

      - name: Manual overrides (workflow_dispatch)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "l1=true" >> "$GITHUB_OUTPUT"
          echo "console_web=true" >> "$GITHUB_OUTPUT"
          echo "console_contracts=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.run_long }}" = "true" ]; then
            echo "l2=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.run_livecheck }}" = "true" ]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "livecheck_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Path filter
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            l1:
              - "truffles-api/app/**"
              - "truffles-api/tests/**"
              - "knowledge/**"
              - "ops/**"
              - ".github/workflows/**"
            l2:
              - "truffles-api/app/knowledge/**/EVAL.yaml"
              - "truffles-api/app/knowledge/**/SALON_TRUTH.yaml"
              - "truffles-api/tests/test_demo_salon_eval.py"
            deploy_required:
              - "truffles-api/app/**"
              - "truffles-api/migrations/**"
              - "truffles-api/scripts/**"
              - "truffles-api/requirements.txt"
              - "truffles-api/Dockerfile"
              - "scripts/restart_api.sh"
              - "scripts/restart_workers.sh"
              - "scripts/restart_release.sh"
              - "scripts/check_migration_governance.py"
              - "knowledge/**"
            livecheck_required:
              - "truffles-api/app/**"
              - "truffles-api/migrations/**"
              - "truffles-api/scripts/**"
              - "truffles-api/requirements.txt"
              - "truffles-api/Dockerfile"
              - "scripts/restart_api.sh"
              - "scripts/restart_workers.sh"
              - "scripts/restart_release.sh"
              - "scripts/check_migration_governance.py"
              - "knowledge/**"
              - "ops/**"
              - ".github/workflows/**"
            console_web:
              - "console-web/**"
              - ".github/workflows/**"
            console_contracts:
              - "contracts/console_api/**"
              - "truffles-api/app/routers/console.py"
              - "truffles-api/app/schemas/console.py"
              - "truffles-api/app/services/console_auth.py"
              - "truffles-api/scripts/generate_openapi.py"
              - ".github/workflows/**"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Migration governance check
        run: python ../scripts/check_migration_governance.py --strict

      - name: Smoke test (catches ImportError)
        run: python -c "from app.main import app; print('✓ App imports OK')"

      - name: Validate OpenAPI contracts
        run: |
          pip install openapi-spec-validator
          python -m openapi_spec_validator ../contracts/console_api/openapi.v1.yaml
          echo "✓ OpenAPI spec valid"

      - name: OpenAPI drift check (console)
        run: |
          python scripts/generate_openapi.py --check

  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Unit tests
        run: |
          pytest -v --tb=short \
            --ignore=tests/test_demo_salon_eval.py \
            --ignore=tests/test_message_endpoint.py \
            --ignore=tests/test_chatflow_contract.py \
            --ignore=tests/test_knowledge_service.py

  console-e2e:
    needs: [changes]
    if: needs.changes.outputs.console_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console-web
    env:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-console-secret
      KEYCLOAK_CLIENT_ID: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_ID || 'console-web' }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_ISSUER: ${{ secrets.CONSOLE_KEYCLOAK_ISSUER || 'https://auth.truffles.kz/realms/truffles' }}
      NEXT_PUBLIC_API_URL: https://api.truffles.kz/console/v1
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      E2E_USERNAME: ${{ secrets.CONSOLE_E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.CONSOLE_E2E_PASSWORD }}
      E2E_USE_STORAGE_STATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Guard console e2e secrets
        id: guard
        run: |
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "Missing CONSOLE_E2E_USERNAME/CONSOLE_E2E_PASSWORD; skipping Playwright."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${KEYCLOAK_CLIENT_SECRET}" ]; then
            echo "Missing CONSOLE_KEYCLOAK_CLIENT_SECRET; skipping Playwright."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Preflight Keycloak discovery
        if: steps.guard.outputs.skip != 'true'
        run: |
          issuer="${KEYCLOAK_ISSUER%/}"
          url="${issuer}/.well-known/openid-configuration"
          echo "Checking Keycloak discovery endpoint..."
          for i in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 5 --max-time 10 "$url" >/dev/null; then
              echo "Keycloak discovery OK"
              exit 0
            fi
            echo "Keycloak discovery retry $i/5 failed; sleeping 3s"
            sleep 3
          done
          echo "Keycloak discovery failed after retries"
          exit 1

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console-web/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:e2e:smoke

  console-e2e-live:
    needs: [changes]
    if: needs.changes.outputs.console_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console-web
    env:
      PLAYWRIGHT_BASE_URL: https://console.truffles.kz
      PLAYWRIGHT_WEB_SERVER: "0"
      KEYCLOAK_ISSUER: ${{ secrets.CONSOLE_KEYCLOAK_ISSUER || 'https://auth.truffles.kz/realms/truffles' }}
      E2E_USERNAME: ${{ secrets.CONSOLE_E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.CONSOLE_E2E_PASSWORD }}
      E2E_USE_STORAGE_STATE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Guard live e2e secrets
        id: guard
        run: |
          if [ -z "${E2E_USERNAME}" ] || [ -z "${E2E_PASSWORD}" ]; then
            echo "Missing CONSOLE_E2E_USERNAME/CONSOLE_E2E_PASSWORD; skipping Playwright."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Preflight Keycloak discovery
        if: steps.guard.outputs.skip != 'true'
        run: |
          issuer="${KEYCLOAK_ISSUER%/}"
          url="${issuer}/.well-known/openid-configuration"
          echo "Checking Keycloak discovery endpoint..."
          for i in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 5 --max-time 10 "$url" >/dev/null; then
              echo "Keycloak discovery OK"
              exit 0
            fi
            echo "Keycloak discovery retry $i/5 failed; sleeping 3s"
            sleep 3
          done
          echo "Keycloak discovery failed after retries"
          exit 1

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console-web/package-lock.json

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright login smoke (live)
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:e2e:smoke -- e2e/login.spec.ts

  console-contract:
    needs: [changes]
    if: needs.changes.outputs.console_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSOLE_API_TOKEN: ${{ secrets.CONSOLE_API_TOKEN }}
      KEYCLOAK_TOKEN_URL: ${{ secrets.CONSOLE_KEYCLOAK_TOKEN_URL || 'https://auth.truffles.kz/realms/truffles/protocol/openid-connect/token' }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_ID || 'console-web' }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_USERNAME: ${{ secrets.CONSOLE_KEYCLOAK_USERNAME }}
      KEYCLOAK_PASSWORD: ${{ secrets.CONSOLE_KEYCLOAK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard console contract auth
        id: guard
        run: |
          if [ -n "${CONSOLE_API_TOKEN}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${KEYCLOAK_USERNAME}" ] && [ -n "${KEYCLOAK_PASSWORD}" ] && [ -n "${KEYCLOAK_CLIENT_SECRET}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing console auth secrets; skipping Schemathesis."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Schemathesis
        if: steps.guard.outputs.skip != 'true'
        run: pip install schemathesis

      - name: Use pre-provisioned token
        if: steps.guard.outputs.skip != 'true' && env.CONSOLE_API_TOKEN != ''
        run: echo "SCHEMATHESIS_TOKEN=${CONSOLE_API_TOKEN}" >> $GITHUB_ENV

      - name: Fetch console token
        if: steps.guard.outputs.skip != 'true' && env.CONSOLE_API_TOKEN == ''
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          data = urllib.parse.urlencode({
              "grant_type": "password",
              "client_id": os.environ["KEYCLOAK_CLIENT_ID"],
              "client_secret": os.environ["KEYCLOAK_CLIENT_SECRET"],
              "username": os.environ["KEYCLOAK_USERNAME"],
              "password": os.environ["KEYCLOAK_PASSWORD"],
              "scope": "openid",
          }).encode()

          req = urllib.request.Request(os.environ["KEYCLOAK_TOKEN_URL"], data=data, method="POST")
          with urllib.request.urlopen(req) as resp:
              token = json.load(resp)["access_token"]
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"SCHEMATHESIS_TOKEN={token}\\n")
          PY

      - name: Resolve console selection headers
        if: steps.guard.outputs.skip != 'true'
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["SCHEMATHESIS_TOKEN"]
          req = urllib.request.Request(
              "https://api.truffles.kz/console/v1/me",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except Exception as exc:
              print(f"Selection headers skipped: {exc}")
              raise SystemExit(0)

          client = data.get("client") or {}
          branches = data.get("branches") or []
          client_id = client.get("id")
          branch_id = branches[0].get("id") if branches else None

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              if client_id:
                  env_file.write(f"SCHEMATHESIS_CLIENT_ID={client_id}\\n")
              if branch_id:
                  env_file.write(f"SCHEMATHESIS_BRANCH_ID={branch_id}\\n")
          PY

      - name: Schemathesis GET-only smoke
        if: steps.guard.outputs.skip != 'true'
        run: |
          headers=(--header "Authorization: Bearer ${SCHEMATHESIS_TOKEN}")
          if [ -n "${SCHEMATHESIS_CLIENT_ID:-}" ]; then
            headers+=(--header "X-Client-Id: ${SCHEMATHESIS_CLIENT_ID}")
          fi
          if [ -n "${SCHEMATHESIS_BRANCH_ID:-}" ]; then
            headers+=(--header "X-Branch-Id: ${SCHEMATHESIS_BRANCH_ID}")
          fi

          schemathesis --config-file contracts/console_api/schemathesis.toml run contracts/console_api/openapi.v1.yaml \
            --url https://api.truffles.kz/console/v1 \
            --include-method=GET \
            --exclude-path /ops/outbox \
            --exclude-path /ops/jobs \
            --exclude-path /ops/jobs/catalog \
            --exclude-path /ops/jobs/{job_id} \
            --exclude-path /admin/companies \
            --exclude-path /admin/clients \
            --exclude-path /admin/branches \
            --exclude-path /admin/integrations \
            --exclude-path /admin/capabilities \
            --exclude-path /admin/reference-packs \
            --exclude-path /admin/onboarding-contract \
            --exclude-path /admin/webhook-secret \
            --exclude-path /knowledge/current \
            --exclude-path /knowledge/history \
            --exclude-path /inbox/macros \
            --exclude-path /onboarding/status \
            --exclude-path /onboarding/advance \
            --exclude-path /learning/candidates \
            --checks all \
            --request-timeout 10 \
            --max-examples=3 \
            "${headers[@]}"

  console-k6:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_k6 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONSOLE_API_TOKEN: ${{ secrets.CONSOLE_API_TOKEN }}
      KEYCLOAK_TOKEN_URL: ${{ secrets.CONSOLE_KEYCLOAK_TOKEN_URL || 'https://auth.truffles.kz/realms/truffles/protocol/openid-connect/token' }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_ID || 'console-web' }}
      KEYCLOAK_CLIENT_SECRET: ${{ secrets.CONSOLE_KEYCLOAK_CLIENT_SECRET }}
      KEYCLOAK_USERNAME: ${{ secrets.CONSOLE_KEYCLOAK_USERNAME }}
      KEYCLOAK_PASSWORD: ${{ secrets.CONSOLE_KEYCLOAK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard console k6 auth
        id: guard
        run: |
          if [ -n "${CONSOLE_API_TOKEN}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${KEYCLOAK_USERNAME}" ] && [ -n "${KEYCLOAK_PASSWORD}" ] && [ -n "${KEYCLOAK_CLIENT_SECRET}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing console auth secrets; skipping k6."
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Use pre-provisioned token
        if: steps.guard.outputs.skip != 'true' && env.CONSOLE_API_TOKEN != ''
        run: echo "CONSOLE_API_TOKEN=${CONSOLE_API_TOKEN}" >> $GITHUB_ENV

      - name: Fetch console token
        if: steps.guard.outputs.skip != 'true' && env.CONSOLE_API_TOKEN == ''
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          data = urllib.parse.urlencode({
              "grant_type": "password",
              "client_id": os.environ["KEYCLOAK_CLIENT_ID"],
              "client_secret": os.environ["KEYCLOAK_CLIENT_SECRET"],
              "username": os.environ["KEYCLOAK_USERNAME"],
              "password": os.environ["KEYCLOAK_PASSWORD"],
              "scope": "openid",
          }).encode()

          req = urllib.request.Request(os.environ["KEYCLOAK_TOKEN_URL"], data=data, method="POST")
          with urllib.request.urlopen(req) as resp:
              token = json.load(resp)["access_token"]
          print(f"::add-mask::{token}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CONSOLE_API_TOKEN={token}\\n")
          PY

      - name: k6 console smoke
        if: steps.guard.outputs.skip != 'true'
        uses: grafana/k6-action@v0.3.0
        with:
          filename: ops/k6/console_smoke.js
        env:
          CONSOLE_API_URL: https://api.truffles.kz/console/v1
          CONSOLE_API_TOKEN: ${{ env.CONSOLE_API_TOKEN }}

  core-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (core)
        run: pytest -q tests/test_demo_salon_eval.py

  long-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l2 == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-long'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (long)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=long

  asr-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l2 == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-long'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (asr)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=asr

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version

      - name: Secret scan (gitleaks no-git)
        if: github.event_name == 'workflow_dispatch'
        run: |
          /tmp/gitleaks detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug

      - name: Upload gitleaks report
        if: github.event_name == 'workflow_dispatch'
