          name: gitleaks-results.sarif
          path: results.sarif

  build-push:
    if: >-
      ${{
        always() &&
        needs.changes.outputs.deploy_required == 'true' &&
        (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        needs.lint.result == 'success' &&
        needs.unit-tests.result == 'success' &&
        (needs.console-e2e.result == 'success' || needs.console-e2e.result == 'skipped') &&
        (needs.console-contract.result == 'success' || needs.console-contract.result == 'skipped') &&
        (needs.long-eval.result == 'success' || needs.long-eval.result == 'skipped') &&
        (needs.asr-eval.result == 'success' || needs.asr-eval.result == 'skipped') &&
        needs.secret-scan.result == 'success'
      }}
    needs: [changes, lint, unit-tests, console-e2e, console-contract, core-eval, long-eval, asr-eval, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (manual)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ always() && needs.changes.outputs.deploy_required == 'true' }}
    needs: [build-push, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy_gate.outputs.deployed }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Deploy gate
        id: deploy_gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-push.result }}" != "success" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_livecheck }}" = "true" ]; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
            else
              echo "deployed=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_gate: event=${{ github.event_name }} ref=${{ github.ref }} run_livecheck=${{ inputs.run_livecheck }}"

