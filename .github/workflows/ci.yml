            OUTBOUND_ALLOWLIST_JIDS=77015705555@s.whatsapp.net,77785890765@s.whatsapp.net,77000000001@s.whatsapp.net,77000000002@s.whatsapp.net \
            REQUIRE_GHCR=1 VERIFY_VERSION=1 \
            EXPECTED_GIT_COMMIT=${{ github.sha }} EXPECTED_VERSION=${{ github.ref_name }} \
            bash "${RELEASE_SCRIPT}"
            for ENV_FILE in "${ENV_FILES[@]}"; do
              if [ -f "${ENV_FILE}" ]; then
