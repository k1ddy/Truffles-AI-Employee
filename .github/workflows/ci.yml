name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/k1ddy/truffles-ai-employee

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check app tests

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Unit tests (webhook helpers)
        run: pytest -q tests/test_webhook_*.py

  core-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (core)
        run: pytest -q tests/test_demo_salon_eval.py

  long-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (long)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=long

  asr-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (asr)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=asr

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version

      - name: Secret scan (gitleaks no-git)
        if: github.event_name == 'workflow_dispatch'
        run: |
          /tmp/gitleaks detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug

      - name: Upload gitleaks report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif

  build-push:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [lint, unit-tests, core-eval, long-eval, asr-eval, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (manual)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker rm -f truffles-api >/dev/null 2>&1 || true
            IMAGE_TAG=main
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              IMAGE_TAG=sha-${{ github.sha }}
            fi
            IMAGE_NAME=${{ env.IMAGE_NAME }}:${IMAGE_TAG} PULL_IMAGE=1 \
            REQUIRE_GHCR=1 VERIFY_VERSION=1 \
            EXPECTED_GIT_COMMIT=${{ github.sha }} EXPECTED_VERSION=${{ github.ref_name }} \
            bash ~/restart_api.sh

  ci-livecheck:
    if: vars.CI_LIVECHECK_ENABLED == '1' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_RAW="${{ secrets.SSH_PRIVATE_KEY }}"
          export KEY_RAW
          python3 - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          raw = os.environ.get("KEY_RAW", "")
          key_path = Path.home() / ".ssh" / "id_rsa"

          def normalize(content: str) -> str:
              content = content.replace("\r", "")
              if content.startswith('"') and content.endswith('"'):
                  content = content[1:-1]
              if not content.endswith("\n"):
                  content += "\n"
              return content

          def try_write(content: str) -> bool:
              key_path.write_text(normalize(content))
              key_path.chmod(0o600)
              try:
                  subprocess.check_output(
                      ["ssh-keygen", "-yf", str(key_path)],
                      stderr=subprocess.STDOUT,
                  )
                  return True
              except subprocess.CalledProcessError:
                  return False

          candidates = [raw, raw.replace("\r", "")]
          if "\\n" in raw and "\n" not in raw:
              candidates.append(raw.replace("\\n", "\n"))
              candidates.append(raw.replace("\\n", "\n").replace("\r", ""))
          if "\\n" in raw or "\\r" in raw:
              try:
                  candidates.append(raw.encode("utf-8").decode("unicode_escape"))
              except Exception:
                  pass
          for b64 in {
              raw,
              raw.replace("\n", ""),
              raw.replace("\r", ""),
              raw.replace("\\n", ""),
              raw.replace(" ", ""),
          }:
              try:
                  decoded = base64.b64decode(b64)
              except Exception:
                  continue
              try:
                  candidates.append(decoded.decode("utf-8"))
              except UnicodeDecodeError:
                  candidates.append(decoded.decode("utf-8", errors="ignore"))

          seen = set()
          for candidate in candidates:
              if not candidate or not candidate.strip():
                  continue
              if candidate in seen:
                  continue
              seen.add(candidate)
              if try_write(candidate):
                  print("KEY_OK")
                  raise SystemExit(0)

          print("KEY_INVALID")
          raise SystemExit(1)
          PY
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Livecheck safety gate
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SSH="ssh -i ~/.ssh/id_rsa -p ${SERVER_PORT} -o StrictHostKeyChecking=yes ${SERVER_USER}@${SERVER_HOST}"
          $SSH "bash -s" <<'REMOTE' 2>&1 | tee artifacts/livecheck-gate.txt
          set -euo pipefail
          set -x
          TEST_MODE=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${TEST_MODE:-}"')
          ALLOWLIST=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${OUTBOUND_ALLOWLIST_JIDS:-}"')
          LEARNING_MODE=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${LEARNING_MODE:-}"')
          QDRANT_COLLECTION=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${QDRANT_COLLECTION:-}"')
          QDRANT_COLLECTION_EFFECTIVE="${QDRANT_COLLECTION}"
          if [ -z "${QDRANT_COLLECTION_EFFECTIVE}" ]; then
            QDRANT_COLLECTION_EFFECTIVE="truffles_knowledge_ci"
          fi
          echo "TEST_MODE=${TEST_MODE}"
          echo "OUTBOUND_ALLOWLIST_JIDS=${ALLOWLIST}"
          echo "LEARNING_MODE=${LEARNING_MODE}"
          echo "QDRANT_COLLECTION=${QDRANT_COLLECTION}"
          echo "QDRANT_COLLECTION_EFFECTIVE=${QDRANT_COLLECTION_EFFECTIVE}"
          if [ "${TEST_MODE}" != "1" ]; then
            echo "TEST_MODE_NOT_ENABLED"
            exit 1
          fi
          if [ "${ALLOWLIST}" != "77015705555@s.whatsapp.net" ]; then
            echo "ALLOWLIST_MISMATCH"
            exit 1
          fi
          case "${QDRANT_COLLECTION_EFFECTIVE}" in
            *_ci) ;;
            *)
              echo "QDRANT_COLLECTION_UNSAFE"
              exit 1
              ;;
          esac
          REMOTE
          test -s artifacts/livecheck-gate.txt

      - name: Livecheck runner (CA-01/02/03/04/08/09/10)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          SSH="ssh -i ~/.ssh/id_rsa -p ${SERVER_PORT} -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 ${SERVER_USER}@${SERVER_HOST}"
          REMOTE_SCRIPT="$(mktemp)"
          cat > "${REMOTE_SCRIPT}" <<'REMOTE'
          set -euo pipefail
          cd ~/truffles-main
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca01-core \
            --seed 777 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca01.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca02-policy \
            --seed 776 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca02.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca03-info \
            --seed 775 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca03.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca04-service \
            --seed 774 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca04.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca08-state \
            --seed 778 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca08.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca09-manager \
            --seed 779 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca09.jsonl
          python3 ops/diagnose.py livecheck-auto \
            --base-url http://localhost:8000 \
            --client-slug demo_salon \
            --suite ca10-outbox \
            --seed 780 \
            --jid-mode allowlist \
            --remote-jid 77015705555@s.whatsapp.net \
            --poll-timeout 60 \
            --poll-interval 1 > /tmp/livecheck-ca10.jsonl
          tar -czf - \
            /tmp/livecheck-ca01.jsonl \
            /tmp/livecheck-ca02.jsonl \
            /tmp/livecheck-ca03.jsonl \
            /tmp/livecheck-ca04.jsonl \
            /tmp/livecheck-ca08.jsonl \
            /tmp/livecheck-ca09.jsonl \
            /tmp/livecheck-ca10.jsonl
          rm -f /tmp/livecheck-ca01.jsonl \
            /tmp/livecheck-ca02.jsonl \
            /tmp/livecheck-ca03.jsonl \
            /tmp/livecheck-ca04.jsonl \
            /tmp/livecheck-ca08.jsonl \
            /tmp/livecheck-ca09.jsonl \
            /tmp/livecheck-ca10.jsonl
          REMOTE
          attempt=1
          max=3
          while true; do
            if "${SSH}" "bash -s" < "${REMOTE_SCRIPT}" > artifacts/livecheck-artifacts.tar.gz; then
              break
            fi
            status=$?
            if [ "${attempt}" -ge "${max}" ]; then
              exit "${status}"
            fi
            echo "livecheck runner failed (attempt ${attempt}/${max}), retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done
          rm -f "${REMOTE_SCRIPT}"
          tar -xzf artifacts/livecheck-artifacts.tar.gz -C artifacts

      - name: Upload livecheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecheck-artifacts
          path: artifacts
