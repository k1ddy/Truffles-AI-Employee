name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_long:
        description: "Force long-eval/asr-eval"
        type: boolean
        default: false
      run_livecheck:
        description: "Force ci-livecheck (requires deploy)"
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/k1ddy/truffles-ai-employee

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      l1: ${{ steps.manual.outputs.l1 || steps.filter.outputs.l1 }}
      l2: ${{ steps.manual.outputs.l2 || steps.filter.outputs.l2 }}
      deploy_required: ${{ steps.manual.outputs.deploy_required || steps.filter.outputs.deploy_required }}
      livecheck_required: ${{ steps.manual.outputs.livecheck_required || steps.filter.outputs.livecheck_required }}
    steps:
      - uses: actions/checkout@v4

      - name: Manual overrides (workflow_dispatch)
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "l1=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.run_long }}" = "true" ]; then
            echo "l2=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.run_livecheck }}" = "true" ]; then
            echo "deploy_required=true" >> "$GITHUB_OUTPUT"
            echo "livecheck_required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Path filter
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            l1:
              - "truffles-api/app/**"
              - "truffles-api/tests/**"
              - "knowledge/**"
              - "SPECS/**"
              - "STRATEGY/**"
              - "ops/**"
              - ".github/workflows/**"
            l2:
              - "truffles-api/app/knowledge/**/EVAL.yaml"
              - "truffles-api/app/knowledge/**/SALON_TRUTH.yaml"
              - "truffles-api/tests/test_demo_salon_eval.py"
            deploy_required:
              - "truffles-api/app/**"
              - "truffles-api/requirements.txt"
              - "truffles-api/Dockerfile"
              - "knowledge/**"
            livecheck_required:
              - "truffles-api/app/**"
              - "truffles-api/requirements.txt"
              - "truffles-api/Dockerfile"
              - "knowledge/**"
              - "ops/**"
              - ".github/workflows/**"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: truffles-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Smoke test (catches ImportError)
        run: python -c "from app.main import app; print('✓ App imports OK')"

      - name: Validate OpenAPI contracts
        run: |
          pip install openapi-spec-validator
          python -m openapi_spec_validator ../contracts/console_api/openapi.v1.yaml
          echo "✓ OpenAPI spec valid"

  unit-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Unit tests
        run: |
          pytest -v --tb=short \
            --ignore=tests/test_demo_salon_eval.py \
            --ignore=tests/test_message_endpoint.py \
            --ignore=tests/test_chatflow_contract.py \
            --ignore=tests/test_knowledge_service.py

  core-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (core)
        run: pytest -q tests/test_demo_salon_eval.py

  long-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l2 == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-long'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (long)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=long

  asr-eval:
    needs: [lint, unit-tests, changes]
    if: needs.changes.outputs.l2 == 'true' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-long'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: truffles-api
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: truffles-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff

      - name: Tests (asr)
        run: pytest -q tests/test_demo_salon_eval.py -o EVAL_TIER=asr

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        if: github.event_name != 'workflow_dispatch'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          /tmp/gitleaks version

      - name: Secret scan (gitleaks no-git)
        if: github.event_name == 'workflow_dispatch'
        run: |
          /tmp/gitleaks detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif --log-level=debug

      - name: Upload gitleaks report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif

  build-push:
    if: >-
      ${{
        always() &&
        needs.changes.outputs.deploy_required == 'true' &&
        (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
        needs.lint.result == 'success' &&
        needs.unit-tests.result == 'success' &&
        (needs.core-eval.result == 'success' || needs.core-eval.result == 'skipped') &&
        (needs.long-eval.result == 'success' || needs.long-eval.result == 'skipped') &&
        (needs.asr-eval.result == 'success' || needs.asr-eval.result == 'skipped') &&
        needs.secret-scan.result == 'success'
      }}
    needs: [changes, lint, unit-tests, core-eval, long-eval, asr-eval, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (main)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

      - name: Build and push image (manual)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./truffles-api
          file: ./truffles-api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: |
            type=registry,ref=${{ env.IMAGE_NAME }}:main
            type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ always() }}
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.deploy_gate.outputs.deployed }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Deploy gate
        id: deploy_gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ needs.build-push.result }}" != "success" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_livecheck }}" = "true" ]; then
              echo "deployed=true" >> "$GITHUB_OUTPUT"
            else
              echo "deployed=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "deploy_gate: event=${{ github.event_name }} ref=${{ github.ref }} run_livecheck=${{ inputs.run_livecheck }}"

      - name: Deploy to VPS
        if: ${{ steps.deploy_gate.outputs.deployed == 'true' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export ALLOWLIST="77015705555@s.whatsapp.net,77759841926@s.whatsapp.net,77781658799@s.whatsapp.net"
            ENV_FILES=(
              "/home/zhan/infrastructure/.env"
              "/home/zhan/.env"
              "/home/zhan/truffles-main/.env"
              "/home/zhan/truffles-main/truffles-api/.env"
            )
            python3 - <<'PY'
            import os
            from pathlib import Path

            allowlist = os.environ.get("ALLOWLIST", "")
            if not allowlist:
                raise SystemExit("ALLOWLIST missing in deploy environment")
            paths = [
                "/home/zhan/infrastructure/.env",
                "/home/zhan/.env",
                "/home/zhan/truffles-main/.env",
                "/home/zhan/truffles-main/truffles-api/.env",
            ]

            for path in paths:
                env_path = Path(path)
                if not env_path.exists():
                    print(f"ENV_FILE missing: {path}")
                    continue
                try:
                    text = env_path.read_text()
                except Exception as exc:
                    print(f"ENV_FILE read failed: {path}: {exc}")
                    continue
                lines = text.splitlines()
                updated = False
                for idx, line in enumerate(lines):
                    if line.strip().startswith("OUTBOUND_ALLOWLIST_JIDS="):
                        lines[idx] = f"OUTBOUND_ALLOWLIST_JIDS={allowlist}"
                        updated = True
                if not updated:
                    lines.append(f"OUTBOUND_ALLOWLIST_JIDS={allowlist}")
                new_text = "\n".join(lines)
                if text.endswith("\n"):
                    new_text += "\n"
                try:
                    env_path.write_text(new_text)
                except Exception as exc:
                    print(f"ENV_FILE write failed: {path}: {exc}")
                    continue
                print(f"ALLOWLIST in {path}:")
                for line_no, line in enumerate(lines, 1):
                    if "OUTBOUND_ALLOWLIST_JIDS=" in line:
                        print(f"{line_no}:{line}")
            PY
            COMPOSE_FILE="/home/zhan/infrastructure/docker-compose.truffles.yml"
            if [ -f "${COMPOSE_FILE}" ]; then
              sed -i "s|OUTBOUND_ALLOWLIST_JIDS=.*|OUTBOUND_ALLOWLIST_JIDS=${ALLOWLIST}|" "${COMPOSE_FILE}"
              sed -i "s|OUTBOUND_ALLOWLIST_JIDS:[[:space:]]*.*|OUTBOUND_ALLOWLIST_JIDS: ${ALLOWLIST}|" "${COMPOSE_FILE}"
              echo "ALLOWLIST in ${COMPOSE_FILE}:"
              grep -n 'OUTBOUND_ALLOWLIST_JIDS' "${COMPOSE_FILE}" || true
            fi
            for ENV_FILE in "${ENV_FILES[@]}"; do
              if [ -f "${ENV_FILE}" ]; then
                echo "ALLOWLIST in ${ENV_FILE}:"
                grep -n 'OUTBOUND_ALLOWLIST_JIDS=' "${ENV_FILE}" || true
                ls -l "${ENV_FILE}" || true
              else
                echo "ENV_FILE missing: ${ENV_FILE}"
              fi
            done
            if [ -f "/home/zhan/restart_api.sh" ]; then
              grep -n 'OUTBOUND_ALLOWLIST_JIDS' /home/zhan/restart_api.sh || true
              grep -n 'CHATFLOW_JID' /home/zhan/restart_api.sh || true
              grep -n 'env-file' /home/zhan/restart_api.sh || true
              grep -n 'docker compose' /home/zhan/restart_api.sh || true
              grep -n '^cd ' /home/zhan/restart_api.sh || true
            fi
            docker rm -f truffles-api >/dev/null 2>&1 || true
            IMAGE_TAG=main
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              IMAGE_TAG=sha-${{ github.sha }}
            fi
            IMAGE_NAME=${{ env.IMAGE_NAME }}:${IMAGE_TAG} PULL_IMAGE=1 \
            OUTBOUND_ALLOWLIST_JIDS=77015705555@s.whatsapp.net,77759841926@s.whatsapp.net,77781658799@s.whatsapp.net \
            REQUIRE_GHCR=1 VERIFY_VERSION=1 \
            EXPECTED_GIT_COMMIT=${{ github.sha }} EXPECTED_VERSION=${{ github.ref_name }} \
            bash ~/restart_api.sh
            for ENV_FILE in "${ENV_FILES[@]}"; do
              if [ -f "${ENV_FILE}" ]; then
                echo "ALLOWLIST after restart in ${ENV_FILE}:"
                grep -n 'OUTBOUND_ALLOWLIST_JIDS=' "${ENV_FILE}" || true
              fi
            done
            docker exec truffles-api /bin/sh -lc 'printf "OUTBOUND_ALLOWLIST_JIDS=%s\n" "${OUTBOUND_ALLOWLIST_JIDS:-}"' || true

  ci-livecheck:
    if: >-
      ${{
        needs.changes.outputs.livecheck_required == 'true' &&
        (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      }}
    needs: [changes, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Livecheck gate
        id: livecheck_gate
        run: |
          run_livecheck="false"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run_livecheck="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.run_livecheck }}" = "true" ]; then
              run_livecheck="true"
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            run_livecheck="true"
          fi
          echo "run=${run_livecheck}" >> "$GITHUB_OUTPUT"
          echo "livecheck_gate: event=${{ github.event_name }} ref=${{ github.ref }} run_livecheck=${{ inputs.run_livecheck }} deploy_result=${{ needs.deploy.result }} gate_run=${run_livecheck}"

      - name: Configure SSH
        if: ${{ steps.livecheck_gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY_RAW="${{ secrets.SSH_PRIVATE_KEY }}"
          export KEY_RAW
          python3 - <<'PY'
          import base64
          import os
          import subprocess
          from pathlib import Path

          raw = os.environ.get("KEY_RAW", "")
          key_path = Path.home() / ".ssh" / "id_rsa"

          def normalize(content: str) -> str:
              content = content.replace("\r", "")
              if content.startswith('"') and content.endswith('"'):
                  content = content[1:-1]
              if not content.endswith("\n"):
                  content += "\n"
              return content

          def try_write(content: str) -> bool:
              key_path.write_text(normalize(content))
              key_path.chmod(0o600)
              try:
                  subprocess.check_output(
                      ["ssh-keygen", "-yf", str(key_path)],
                      stderr=subprocess.STDOUT,
                  )
                  return True
              except subprocess.CalledProcessError:
                  return False

          candidates = [raw, raw.replace("\r", "")]
          if "\\n" in raw and "\n" not in raw:
              candidates.append(raw.replace("\\n", "\n"))
              candidates.append(raw.replace("\\n", "\n").replace("\r", ""))
          if "\\n" in raw or "\\r" in raw:
              try:
                  candidates.append(raw.encode("utf-8").decode("unicode_escape"))
              except Exception:
                  pass
          for b64 in {
              raw,
              raw.replace("\n", ""),
              raw.replace("\r", ""),
              raw.replace("\\n", ""),
              raw.replace(" ", ""),
          }:
              try:
                  decoded = base64.b64decode(b64)
              except Exception:
                  continue
              try:
                  candidates.append(decoded.decode("utf-8"))
              except UnicodeDecodeError:
                  candidates.append(decoded.decode("utf-8", errors="ignore"))

          seen = set()
          for candidate in candidates:
              if not candidate or not candidate.strip():
                  continue
              if candidate in seen:
                  continue
              seen.add(candidate)
              if try_write(candidate):
                  print("KEY_OK")
                  raise SystemExit(0)

          print("KEY_INVALID")
          raise SystemExit(1)
          PY
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Livecheck runner (CA-01/02/03/04/05/06/07/08/09/10)
        if: ${{ steps.livecheck_gate.outputs.run == 'true' }}
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          RUN_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH=(ssh -i ~/.ssh/id_rsa -p ${SERVER_PORT} -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=5 ${SERVER_USER}@${SERVER_HOST})
          if ! "${SSH[@]}" "echo livecheck-ready" >/dev/null 2>&1; then
            echo "livecheck skipped: ssh unreachable" | tee artifacts/livecheck-skip.txt
            exit 0
          fi
          REMOTE_SCRIPT="$(mktemp)"
          cat > "${REMOTE_SCRIPT}" <<'REMOTE'
          set -euo pipefail
          RUN_ID="${RUN_ID:?}"
          GIT_SHA="${GIT_SHA:?}"
          GATE_LOG="/tmp/livecheck-gate-${RUN_ID}.txt"
          RUN_LOG="/tmp/livecheck-run-${RUN_ID}.log"
          ARTIFACT_TAR="/tmp/livecheck-artifacts-${RUN_ID}.tar.gz"
          : > "${GATE_LOG}"
          : > "${RUN_LOG}"
          cleanup() {
            tar -czf "${ARTIFACT_TAR}" -C /tmp \
              "livecheck-gate-${RUN_ID}.txt" \
              "livecheck-run-${RUN_ID}.log" \
              "livecheck-ca01-core.jsonl" \
              "livecheck-ca02-policy.jsonl" \
              "livecheck-ca03-info.jsonl" \
              "livecheck-ca04-service.jsonl" \
              "livecheck-ca05-booking.jsonl" \
              "livecheck-ca06-consult.jsonl" \
              "livecheck-ca07-ood.jsonl" \
              "livecheck-ca08-state.jsonl" \
              "livecheck-ca09-manager.jsonl" \
              "livecheck-ca10-outbox.jsonl" \
              2>>"${RUN_LOG}" || true
          }
          trap cleanup EXIT
          TEST_MODE=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${TEST_MODE:-}"')
          ALLOWLIST=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${OUTBOUND_ALLOWLIST_JIDS:-}"')
          LEARNING_MODE=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${LEARNING_MODE:-}"')
          ALERTS_ADMIN_TOKEN=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${ALERTS_ADMIN_TOKEN:-}"')
          OUTBOX_WORKER_ENABLED=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${OUTBOX_WORKER_ENABLED:-}"')
          OUTBOX_WORKER_INTERVAL_SECONDS=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${OUTBOX_WORKER_INTERVAL_SECONDS:-}"')
          OUTBOX_COALESCE_SECONDS=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${OUTBOX_COALESCE_SECONDS:-}"')
          QDRANT_COLLECTION=$(docker exec truffles-api /bin/sh -lc 'printf "%s" "${QDRANT_COLLECTION:-}"')
          QDRANT_COLLECTION_EFFECTIVE="${QDRANT_COLLECTION}"
          if [ -z "${QDRANT_COLLECTION_EFFECTIVE}" ]; then
            QDRANT_COLLECTION_EFFECTIVE="truffles_knowledge_ci"
          fi
          {
            echo "TEST_MODE=${TEST_MODE}"
            echo "OUTBOUND_ALLOWLIST_JIDS=${ALLOWLIST}"
            echo "LEARNING_MODE=${LEARNING_MODE}"
            echo "QDRANT_COLLECTION=${QDRANT_COLLECTION}"
            echo "QDRANT_COLLECTION_EFFECTIVE=${QDRANT_COLLECTION_EFFECTIVE}"
            if [ -n "${ALERTS_ADMIN_TOKEN}" ]; then
              echo "ALERTS_ADMIN_TOKEN_SET=1"
            else
              echo "ALERTS_ADMIN_TOKEN_SET=0"
            fi
            echo "OUTBOX_WORKER_ENABLED=${OUTBOX_WORKER_ENABLED}"
            echo "OUTBOX_WORKER_INTERVAL_SECONDS=${OUTBOX_WORKER_INTERVAL_SECONDS}"
            echo "OUTBOX_COALESCE_SECONDS=${OUTBOX_COALESCE_SECONDS}"
          } > "${GATE_LOG}"
          gate_ok=1
          if [ "${TEST_MODE}" != "1" ]; then
            echo "TEST_MODE_NOT_ENABLED" >> "${GATE_LOG}"
            gate_ok=0
          fi
          if [ -z "${ALERTS_ADMIN_TOKEN}" ]; then
            echo "ALERTS_ADMIN_TOKEN_MISSING" >> "${GATE_LOG}"
            gate_ok=0
          fi
          if [ "${OUTBOX_WORKER_ENABLED}" != "1" ]; then
            echo "OUTBOX_WORKER_DISABLED" >> "${GATE_LOG}"
            gate_ok=0
          fi
          ALLOWLIST_CLEAN="${ALLOWLIST// /}"
          IFS=',' read -r -a ALLOWLIST_POOL <<< "${ALLOWLIST_CLEAN}"
          if [ -z "${ALLOWLIST_CLEAN}" ]; then
            echo "ALLOWLIST_EMPTY" >> "${GATE_LOG}"
            gate_ok=0
          else
            for jid in "${ALLOWLIST_POOL[@]}"; do
              if [ -z "${jid}" ]; then
                echo "ALLOWLIST_EMPTY_ITEM" >> "${GATE_LOG}"
                gate_ok=0
                continue
              fi
              case "${jid}" in
                *@s.whatsapp.net) ;;
                *)
                  echo "ALLOWLIST_INVALID_JID" >> "${GATE_LOG}"
                  gate_ok=0
                  ;;
              esac
            done
          fi
          case "${QDRANT_COLLECTION_EFFECTIVE}" in
            *_ci) ;;
            *)
              echo "QDRANT_COLLECTION_UNSAFE" >> "${GATE_LOG}"
              gate_ok=0
              ;;
          esac
          if [ "${gate_ok}" -ne 1 ]; then
            echo "GATE_FAILED" >> "${RUN_LOG}"
            exit 1
          fi
          POLL_VARS=$(python3 - <<'PY'
          import math
          import os

          def parse(value, default):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return default

          coalesce = parse(os.environ.get("OUTBOX_COALESCE_SECONDS"), 8.0)
          interval = parse(os.environ.get("OUTBOX_WORKER_INTERVAL_SECONDS"), 2.0)
          poll_timeout = max(60.0, coalesce + interval * 5 + 10.0)
          fail_fast_after = max(10.0, min(30.0, poll_timeout / 3))
          print(f"{poll_timeout:.0f} {fail_fast_after:.0f}")
          PY
          )
          set -- ${POLL_VARS}
          POLL_TIMEOUT_BASE="${1:-60}"
          FAIL_FAST_AFTER="${2:-0}"
          echo "POLL_TIMEOUT_BASE=${POLL_TIMEOUT_BASE}" >> "${GATE_LOG}"
          echo "FAIL_FAST_AFTER=${FAIL_FAST_AFTER}" >> "${GATE_LOG}"
          python3 - <<'PY' >> "${RUN_LOG}" 2>&1
          import time
          import urllib.request

          def check(url, deadline):
              while True:
                  try:
                      with urllib.request.urlopen(url, timeout=5) as resp:
                          if 200 <= resp.status < 300:
                              print(f"healthcheck ok: {url} {resp.status}")
                              return
                          print(f"healthcheck status: {url} {resp.status}")
                  except Exception as exc:
                      print(f"healthcheck error: {url} {exc}")
                  if time.time() >= deadline:
                      raise SystemExit(f"healthcheck timeout: {url}")
                  time.sleep(2)

          deadline = time.time() + 90
          check("http://localhost:8000/health", deadline)
          check("http://localhost:8000/admin/health", deadline)
          PY
          SOURCE_REPO="${HOME}/truffles-main"
          git config --global --add safe.directory "${SOURCE_REPO}"
          git config --global --add safe.directory "${SOURCE_REPO}/.git"
          if [ ! -d "${SOURCE_REPO}/.git" ]; then
            echo "source repo missing: ${SOURCE_REPO}" >> "${RUN_LOG}"
            exit 1
          fi
          SOURCE_ORIGIN_URL="$(git -C "${SOURCE_REPO}" config --get remote.origin.url || true)"
          if [ -z "${SOURCE_ORIGIN_URL}" ]; then
            echo "source repo missing origin url: ${SOURCE_REPO}" >> "${RUN_LOG}"
            exit 1
          fi
          WORKDIR="/tmp/truffles-main-${GIT_SHA}"
          if [ ! -d "${WORKDIR}/.git" ]; then
            rm -rf "${WORKDIR}"
            git clone --no-checkout "${SOURCE_REPO}" "${WORKDIR}"
          fi
          cd "${WORKDIR}"
          git config --global --add safe.directory "$(pwd)"
          git remote set-url origin "${SOURCE_ORIGIN_URL}"
          git fetch origin "${GIT_SHA}" --depth=1
          git checkout -q "${GIT_SHA}"
          suite_order=(ca01-core ca02-policy ca03-info ca04-service ca05-booking ca06-consult ca07-ood ca08-state ca09-manager ca10-outbox)
          jid_for_suite() {
            local suite_name="$1"
            local idx=0
            for i in "${!suite_order[@]}"; do
              if [ "${suite_order[$i]}" = "${suite_name}" ]; then
                idx=$i
                break
              fi
            done
            local pool_size=${#ALLOWLIST_POOL[@]}
            if [ "${pool_size}" -le 0 ]; then
              echo ""
              return
            fi
            local pool_idx=$((idx % pool_size))
            echo "${ALLOWLIST_POOL[$pool_idx]}"
          }
          suite_fail=0
          run_suite() {
            local suite_name="$1"
            local suite_seed="$2"
            local suite_jid
            suite_jid=$(jid_for_suite "${suite_name}")
            if [ -z "${suite_jid}" ]; then
              echo "suite ${suite_name} missing allowlist jid" >> "${RUN_LOG}"
              echo "suite ${suite_name} missing allowlist jid"
              suite_fail=1
              return
            fi
            local poll_timeout="${POLL_TIMEOUT_BASE}"
            if [ "${suite_name}" = "ca06-consult" ]; then
              poll_timeout=$((poll_timeout + 60))
            fi
            local request_timeout=30
            local noise_level="low"
            if [ "${suite_name}" = "ca07-ood" ]; then
              noise_level="none"
            fi
            echo "SUITE_${suite_name}_JID=${suite_jid}" >> "${GATE_LOG}"
            local outfile="/tmp/livecheck-${suite_name}.jsonl"
            : > "${outfile}"
            echo "suite ${suite_name} start"
            if python3 ops/diagnose.py livecheck-auto \
              --base-url http://localhost:8000 \
              --client-slug demo_salon \
              --suite "${suite_name}" \
              --seed "${suite_seed}" \
              --noise "${noise_level}" \
              --jid-mode allowlist \
              --remote-jid "${suite_jid}" \
              --allowlist-jids "${ALLOWLIST_CLEAN}" \
              --poll-timeout "${poll_timeout}" \
              --fail-fast-after "${FAIL_FAST_AFTER}" \
              --reset-before-suite \
              --timeout "${request_timeout}" \
              --poll-interval 1 > "${outfile}" 2>>"${RUN_LOG}"; then
              echo "suite ${suite_name} ok"
            else
              echo "suite ${suite_name} failed" >> "${RUN_LOG}"
              echo "suite ${suite_name} failed"
              suite_fail=1
            fi
          }
          run_suite ca01-core 777
          run_suite ca02-policy 776
          run_suite ca03-info 775
          run_suite ca04-service 774
          run_suite ca05-booking 773
          run_suite ca06-consult 772
          run_suite ca07-ood 771
          run_suite ca08-state 778
          run_suite ca09-manager 779
          run_suite ca10-outbox 780
          if [ "${suite_fail}" -ne 0 ]; then
            exit 1
          fi
          REMOTE
          run_status=0
          SCRIPT_PATH="/tmp/livecheck-${RUN_ID}.sh"
          if "${SSH[@]}" "RUN_ID=${RUN_ID} GIT_SHA=${GITHUB_SHA} bash -c 'cat > ${SCRIPT_PATH} && chmod 700 ${SCRIPT_PATH} && bash ${SCRIPT_PATH} < /dev/null; status=\$?; rm -f ${SCRIPT_PATH}; exit \$status'" < "${REMOTE_SCRIPT}"; then
            run_status=0
          else
            run_status=$?
          fi
          rm -f "${REMOTE_SCRIPT}"
          if [ "${run_status}" -eq 255 ]; then
            echo "livecheck skipped: ssh unreachable (exit 255)" | tee artifacts/livecheck-skip.txt
            exit 0
          fi
          attempt=1
          max=5
          status=1
          REMOTE_TAR="/tmp/livecheck-artifacts-${RUN_ID}.tar.gz"
          while true; do
            if "${SSH[@]}" "cat ${REMOTE_TAR}" > artifacts/livecheck-artifacts.tar.gz; then
              if tar -tzf artifacts/livecheck-artifacts.tar.gz >/dev/null 2>&1; then
                break
              fi
              echo "livecheck artifacts download incomplete, retrying..."
              status=1
            else
              status=$?
            fi
            if [ "${attempt}" -ge "${max}" ]; then
              exit "${status}"
            fi
            echo "livecheck artifacts download failed (attempt ${attempt}/${max}), retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done
          tar -xzf artifacts/livecheck-artifacts.tar.gz -C artifacts
          if [ "${run_status}" -ne 0 ]; then
            run_log=$(ls artifacts/livecheck-run-*.log 2>/dev/null | head -n 1 || true)
            if [ -n "${run_log}" ]; then
              echo "LIVECHECK_RUN_LOG_TAIL_START"
              tail -n 200 "${run_log}" || true
              echo "LIVECHECK_RUN_LOG_TAIL_END"
            fi
          fi
          if [ ! -s artifacts/livecheck-gate.txt ]; then
            gate_file=$(ls artifacts/livecheck-gate-*.txt 2>/dev/null | head -n 1 || true)
            if [ -n "${gate_file}" ]; then
              mv "${gate_file}" artifacts/livecheck-gate.txt
            fi
          fi
          test -s artifacts/livecheck-gate.txt
          if [ "${run_status}" -ne 0 ]; then
            exit "${run_status}"
          fi

      - name: Generate livecheck evidence
        if: always()
        run: |
          set -euo pipefail
          if ls artifacts/livecheck-*.jsonl >/dev/null 2>&1; then
            python3 ops/diagnose.py emit-evidence \
              --input-dir artifacts \
              --gate artifacts/livecheck-gate.txt \
              --output artifacts/livecheck-evidence.md
          else
            echo "No livecheck jsonl artifacts found; skipping evidence."
          fi

      - name: Upload livecheck artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livecheck-artifacts
          path: artifacts
